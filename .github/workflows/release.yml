# =============================================================================
# Release (test-gated, tag-driven)
# =============================================================================
# ONE COMMIT FLOWS THROUGH THE WHOLE RELEASE. `validate` resolves the ref that
# will be tagged and PINS IT TO A SHA; every gate job checks out that exact SHA;
# `bump-and-tag` refuses to tag if the branch moved underneath the gate; and the
# archive and the images are built from the CREATED TAG, after the bump.
#
# That was not true before 2026-08-31. The gate did a bare `actions/checkout`
# (github.ref), `bump-and-tag` checked out `ref: main` and tagged that, and
# `artifacts`/`publish-images`/`verify-config` all carried `needs: [validate,
# test]` — NOT `needs: bump-and-tag` — and checked out github.ref. So a
# workflow_dispatch tested one commit, tagged another, and built the tarball and
# the ten images from a third, IN PARALLEL WITH the version bump: the shipped
# `mirage-v1.0.0.tar.gz` carried a nextflow.config still reading the PREVIOUS
# version, and the images were built from the un-bumped tree.
#
# WHAT THE GATE RUNS. The `test` job is an aggregator over the same five jobs
# `ci.yml`'s blocking `all-tests` gate requires — python-tests, nextflow-stub,
# nf-test-stub, security-tests, ruff — reproduced here as test-python,
# test-nextflow, test-nf-test, test-security and test-ruff. Before that it ran 5
# of those 13 blocking checks (the DISK non-skip proof, `pytest -v tests/`,
# `run_validation_tests.sh` and one `-profile test -stub` run) while its header
# claimed parity, so a release could ship with a broken `lib/` class, a leaking
# DEEPCELL token, a profile that would not parse or a param/schema mismatch, and
# be green.
#
# Three deliberate narrowings, so this header stays honest:
#   * test-python runs ONE Python version (3.10), where ci.yml matrixes
#     3.10 + 3.11. The matrix exists in ci.yml to catch resolver splits between
#     interpreter versions, and it runs on every push; a second leg here would
#     re-pay a ~190 MB torch install to re-test a resolution ci.yml has already
#     exercised on the same commit.
#   * nf-core structural lint is absent, exactly as it is absent from ci.yml's
#     `all-tests`: it runs `|| true` and can never fail.
#   * The nf-test REAL and INTEGRATION suites are absent, also as in
#     `all-tests`. `nf-test-real` is advisory in ci.yml (see the comment on that
#     job); gating a version tag on an advisory suite would block every release.
# Everything else ci.yml blocks on, this gate blocks on.
#
# Two entry points:
#   * workflow_dispatch (input: version) -> validate (pins main's SHA) -> the
#     five gate jobs on that SHA -> test -> bump-and-tag (writes
#     manifest.version, commits, creates+pushes the tag on main) ->
#     publish-images + artifacts, BOTH FROM THE TAG -> release-notes.
#   * release:published -> the tag already exists, so `validate` pins the TAG's
#     SHA, the gate runs on the tag, bump-and-tag is skipped, verify-config
#     confirms the committed config matches the tag, and publish-images +
#     artifacts build from the same tag.
#
# `artifacts` and `publish-images` therefore need `bump-and-tag`, which is
# SKIPPED on the release path — and a job whose dependency is skipped is itself
# skipped. That is why both carry `if: always() && ...` and re-assert
# validate/test explicitly: `always()` is what lets a SKIPPED bump-and-tag
# through, and the explicit result checks are what keep a FAILED gate from
# getting through with it. tests/test_release_workflow_graph.py asserts all of
# this structurally.
# =============================================================================
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.0.0)'
        required: true
        type: string

# Least-privilege default: read-only. The two jobs that write (bump-and-tag,
# release-notes) escalate explicitly per-job below. publish-images pushes to
# Docker Hub via DOCKERHUB_* secrets (no extra GITHUB_TOKEN scope needed).
permissions:
  contents: read

# Serialize releases per ref but NEVER cancel one in flight — a half-published
# release (tag pushed, images missing) is worse than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NFTEST_VERSION: '0.9.0'
  # Same mechanism as ci.yml: point every job at one cacheable plugins
  # directory instead of ~/.nextflow/plugins, so nf-schema is downloaded once
  # and the air-gapped NXF_PLUGINS_DIR path documented in docs/usage.md is
  # exercised rather than only described.
  NXF_PLUGINS_DIR: ${{ github.workspace }}/.nextflow-plugins

jobs:
  # ===========================================================================
  # Job 1 - validate the requested/release version string, and PIN the exact
  # commit the whole release is built from.
  # ===========================================================================
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    # A regex check on one string plus a shallow checkout and a rev-parse.
    timeout-minutes: 5
    outputs:
      version: ${{ steps.get_version.outputs.version }}        # e.g. v1.0.0
      version_no_v: ${{ steps.get_version.outputs.version_no_v }}  # e.g. 1.0.0
      # The ref that WILL BE TAGGED: `main` on a dispatch (bump-and-tag tags
      # main), the tag itself on a published release (it already exists).
      gate_ref: ${{ steps.get_version.outputs.gate_ref }}
      # gate_ref resolved to an immutable SHA. Every gate job checks out THIS,
      # not gate_ref, so the five jobs cannot test five different trees if the
      # branch moves mid-run, and bump-and-tag can prove it is tagging what was
      # tested.
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            # The tag exists already; it IS what gets released, so gate on it.
            GATE_REF="$VERSION"
          else
            VERSION="${{ github.event.inputs.version }}"
            # bump-and-tag below tags main. The gate must therefore test main,
            # not whatever branch the dispatch was fired from — testing the
            # dispatch branch and tagging main is the defect this replaces.
            GATE_REF="main"
            # ...which means firing this from a feature branch releases MAIN and
            # silently ignores the branch you fired from. That is the correct
            # behaviour, but it is not the obvious one, so say it out loud. A
            # ::notice:: rather than a hard failure: refusing here would add a new
            # way for the release path to fail, days before v1.0.0, on a path that
            # cannot be rehearsed against Actions -- and the run is not wrong, only
            # the operator's expectation might be.
            if [ "${{ github.ref_name }}" != "main" ]; then
              echo "::notice::Dispatched from '${{ github.ref_name }}', but a release always gates and tags MAIN. Nothing on '${{ github.ref_name }}' is released unless it is already merged to main."
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_no_v=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "gate_ref=$GATE_REF" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION (gating on ref: $GATE_REF)"

      - name: Validate version format (FAIL on bad format)
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: '$VERSION'. Expected vX.Y.Z (e.g. v1.0.0)."
            exit 1
          fi
          echo "Version format OK: $VERSION"

      - name: Checkout the ref that will be tagged
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.get_version.outputs.gate_ref }}

      - name: Pin the release commit
        id: pin
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Release commit: $SHA (${{ steps.get_version.outputs.gate_ref }})"

  # ===========================================================================
  # Gate job A - the Python unit suite, mirroring ci.yml's `python-tests`.
  # ===========================================================================
  test-python:
    name: Gate - Python tests
    needs: validate
    runs-on: ubuntu-latest
    # ci.yml budgets 30 minutes per matrix leg for the same work.
    timeout-minutes: 40
    steps:
      - name: Checkout the pinned release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}

      # NOTE: no `docker/setup-buildx-action` here on purpose. Every step in this
      # job is container-free. Guarded by
      # tests/test_ci_job_hygiene.py::test_buildx_job_must_actually_use_buildx.

      # `cache-dependency-path` is NOT optional now that the pins live in requirements/.
      # `cache: 'pip'` defaults its key to the hash of `**/requirements.txt`, and after the
      # move the only files matching that glob are the root shim and docs/requirements.txt
      # -- neither of which changes when a pin does. The cache key would have gone stale
      # exactly when it must rotate: the run after a bump would restore a cache built for
      # the OLD wheels (~190 MB of torch among them). Keying on requirements/** rotates it
      # on any pin change, including torch's and kornia's, which the old `**/requirements.txt`
      # key never did.
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements/**'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # EVERY version string lives in requirements/, never here. That is not a style
          # preference: the same pins used to be written twice -- once in this YAML and
          # once in the production image -- and a 42 KB guard test existed only to prove
          # the two copies were equal. requirements/ci.txt `-r`-includes
          # requirements/segeval.txt and requirements/tiled.txt, the very files
          # containers/segeval and containers/tiled build from, so there is one copy and
          # nothing left to prove equal. Read requirements/ci.txt: it documents what this
          # environment is, and the one place (anndata) where it honestly cannot match a
          # shipped image.
          #
          # There is deliberately NO `pip install -r requirements.txt` (the ROOT file).
          # It is an unpinned developer-convenience superset carrying a
          # `git+https://github.com/vanvalenlab/deepcell-types@master` clone that does not
          # install on Python 3.10 at all, and it was once installed in this BLOCKING gate
          # with `|| true`, so total failure was swallowed. The root file is now a shim
          # that points at requirements/ci.txt and says so.
          #
          # tests/test_ci_stack_pinned.py asserts that no workflow names a package version
          # anywhere -- a closed rule with no package list to keep up to date.
          pip install -r requirements/ci.txt
          # torch + kornia power STARE's DISK+LightGlue COARSE front-end
          # (bin/utils/coarse_align.py). Without them tests/test_coarse_frontend.py's DISK
          # cases importorskip and prove nothing -- which is how an unimplemented front-end
          # shipped once already. tests/test_disk_test_actually_runs.py asserts these two
          # lines exist in every workflow that runs the suite.
          #
          # TWO SEPARATE INVOCATIONS, in this order, matching containers/tiled/Dockerfile
          # exactly. requirements/torch-cpu.txt carries `--index-url .../whl/cpu`, which
          # applies to the WHOLE resolve if the file is pulled in by `-r` from another
          # requirements file -- so it must stay its own step. And kornia drags the ~2.5 GB
          # CUDA wheel from PyPI if torch is not already satisfied, so torch goes first.
          pip install -r requirements/torch-cpu.txt
          pip install -r requirements/kornia.txt

      - name: Generate test data
        run: |
          python tests/testdata/generate_complete_testdata.py

      # A skip is not a pass. tests/test_coarse_frontend.py's DISK+LightGlue cases
      # guard themselves with importorskip("torch")/importorskip("kornia"), so a
      # missing, broken or CUDA-only install turns them into silent skips -- which is
      # how an unimplemented front-end shipped once already. This step proves both
      # libraries import in the SAME interpreter pytest runs in, and then proves the
      # file reports ZERO skips. tests/test_disk_test_actually_runs.py asserts this
      # step exists in every workflow that runs the pytest suite.
      - name: Assert the DISK front-end test is not skipped
        run: |
          set -euo pipefail
          python -c "import torch, kornia; print(torch.__version__, kornia.__version__)"
          pytest tests/test_coarse_frontend.py -rs -q | tee coarse_frontend.log
          if grep -qi 'skipped' coarse_frontend.log; then
            echo "::error::tests/test_coarse_frontend.py reported a SKIP -- the DISK+LightGlue case did not run"
            exit 1
          fi

      # MIRAGE_STRICT_SKIPS turns on tests/conftest.py's session floor: any skip
      # not in tests/expected_skips.txt fails the gate by name, and the collected
      # count must clear tests/collected_floor.txt. This gate is the one that
      # shipped for months missing three packages -- 13 tests failed and 30 more
      # silently vanished, and only the 13 were visible. Identical to ci.yml's
      # `python-tests`, and STEP level for the same reason: the DISK non-skip
      # proof step above runs pytest over one file, well below the floor.
      - name: Run Python tests
        env:
          MIRAGE_STRICT_SKIPS: '1'
        run: |
          pytest -v tests/ \
            --ignore=tests/testdata \
            --ignore=tests/modules \
            --ignore=tests/subworkflows \
            --ignore=tests/integration

  # ===========================================================================
  # Gate job B - the Nextflow stub leg, mirroring ci.yml's `nextflow-stub`,
  # INCLUDING its version matrix. `manifest.nextflowVersion` is `>=25.04.0`, and
  # this repo documents that NF25 and NF26 differ on config-scope `log` binding
  # and on CLI param stringification — so a gate that blocks a version tag while
  # exercising only `latest-everything` never tests the minimum the manifest
  # promises. It ran exactly that way until 2026-08-31.
  # ===========================================================================
  test-nextflow:
    name: Gate - NF ${{ matrix.nextflow-version }} stub
    needs: validate
    runs-on: ubuntu-latest
    # ci.yml budgets 30 minutes for the same step list.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        nextflow-version: ['25.04.0', 'latest-everything']
    steps:
      - name: Checkout the pinned release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Cache Nextflow
        uses: actions/cache@v4
        with:
          path: ~/.nextflow
          key: ${{ runner.os }}-nextflow-release-${{ matrix.nextflow-version }}-${{ hashFiles('**/*.nf') }}
          restore-keys: |
            ${{ runner.os }}-nextflow-release-${{ matrix.nextflow-version }}-
            ${{ runner.os }}-nextflow-

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nextflow-version }}

      - name: Cache Nextflow plugins
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nextflow-plugins
          key: ${{ runner.os }}-nf-plugins-${{ hashFiles('nextflow.config') }}
          restore-keys: |
            ${{ runner.os }}-nf-plugins-

      - name: Provision Nextflow plugins
        # Install the pinned nf-schema explicitly so a registry outage fails in
        # a step that names it, instead of halfway into a pipeline run. The
        # version is read out of nextflow.config rather than duplicated here, so
        # CI and the pipeline cannot pin different versions. No-op when the
        # cache above already restored it. Every one of ci.yml's five Nextflow
        # jobs has carried this step; this workflow had none.
        run: |
          nextflow plugin install "$(sed -n "s/.*id '\(nf-schema@[0-9.]*\)'.*/\1/p" nextflow.config)"

      - name: Install Python for test data generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements/**'

      - name: Generate test data
        run: |
          # numpy and tifffile at the harmonised versions, taken from
          # requirements/constraints.txt -- the same file every container image reads. No
          # version is named here; there is nothing to keep in step by hand.
          pip install -r requirements/testdata.txt
          python tests/testdata/generate_complete_testdata.py

      - name: Check all profiles parse without the gitignored site config
        # Guards against the strict-parser regression class: a committed profile
        # must never includeConfig a gitignored/missing file (breaks every
        # profile in CI). Runs with conf/ieo.config absent (it already is here).
        run: |
          bash tests/check_profiles_parse.sh

      - name: Check param surface consistency (config <-> schema <-> code)
        # Fails if a param is declared/used but undocumented in nextflow_schema.json
        # (or vice-versa) — keeps the parameter surface from drifting.
        run: |
          python3 tests/check_param_consistency.py

      - name: Run pipeline validation tests
        run: |
          bash tests/run_validation_tests.sh

      - name: lib/ probe — assert lib/*.groovy behaviour
        # The ONLY unit-test surface lib/*.groovy has: nf-test's assertion
        # context cannot see lib/ classes, so the assertions live inside the
        # script. A failing assert exits nonzero and fails this gate job. A
        # release could previously ship a broken lib/ class, green.
        run: |
          nextflow run tests/lib_probe.nf -lib lib

      - name: Run pipeline with test profile (stub mode)
        # Stub blocks only `touch` outputs — no container engine needed. Running
        # container-free keeps this gate green without pulling per-process
        # images, which on a fresh tag do not exist yet (publish-images runs
        # after this gate, by design).
        run: |
          nextflow run . \
            -profile test \
            -stub \
            --outdir test_results_stub

      - name: Run pipeline with SHIPPED defaults (stub mode)
        # `-profile test` pins BOTH pixel_size (-> 0.325) and seg_method
        # (-> 'stardist') away from what actually ships ('auto' / 'instantseg'),
        # each for its own documented reason (conf/test.config) -- which means
        # the exact combination that ships was never executed by this gate.
        # `shipped_defaults_test` overrides both back and repoints `input` at
        # the one fixture pair this repo generates with a real OME
        # PhysicalSizeX/Y (tests/testdata/shipped_defaults_input.csv), because
        # every other fixture is scale-less on purpose and `auto` would
        # (correctly) hard-fail at PREFLIGHT_SCALE against it.
        run: |
          nextflow run . \
            -profile shipped_defaults_test \
            -stub \
            --outdir test_results_shipped_defaults

      - name: Verify work-directory cleanup and final-outputs-only publishing
        # A shell script, not a pytest and not an nf-test, and it needs its own
        # step or it runs nowhere. `cleanup` is a Nextflow session-teardown
        # behaviour, invisible to a static guard over the sources and gone by
        # the time nf-test's assertion context runs. The script's fourth case is
        # the load-bearing one -- cleanup must never fire on a FAILED run, or a
        # real failure becomes undiagnosable.
        run: |
          bash tests/cleanup_work.sh

      - name: Upload stub test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-stub-results-nf-${{ matrix.nextflow-version }}
          path: |
            test_results_stub/
            test_results_shipped_defaults/
            .nextflow.log

  # ===========================================================================
  # Gate job C - the nf-test stub suite, mirroring ci.yml's `nf-test-stub`.
  # ~16 minutes. A release gate is rare and 214 cases of channel wiring is what
  # a version tag ought to cost; the timeout below is sized for it.
  # ===========================================================================
  test-nf-test:
    name: Gate - nf-test (stub)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the pinned release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Cache Nextflow
        uses: actions/cache@v4
        with:
          path: ~/.nextflow
          key: ${{ runner.os }}-nextflow-release-nftest-${{ hashFiles('**/*.nf') }}
          restore-keys: |
            ${{ runner.os }}-nextflow-

      - name: Install Nextflow
        # Pinned to the supported release: nf-test 0.9.0's generated test
        # wrappers do not compile under edge Nextflow's strict parser.
        # latest-everything full-pipeline compatibility is covered by the
        # test-nextflow job's matrix above.
        uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.0'

      - name: Cache Nextflow plugins
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nextflow-plugins
          key: ${{ runner.os }}-nf-plugins-${{ hashFiles('nextflow.config') }}
          restore-keys: |
            ${{ runner.os }}-nf-plugins-

      - name: Provision Nextflow plugins
        run: |
          nextflow plugin install "$(sed -n "s/.*id '\(nf-schema@[0-9.]*\)'.*/\1/p" nextflow.config)"

      - name: Install Python for test data generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements/**'

      - name: Generate test data
        run: |
          # numpy and tifffile at the harmonised versions, taken from
          # requirements/constraints.txt -- the same file every container image reads. No
          # version is named here; there is nothing to keep in step by hand.
          pip install -r requirements/testdata.txt
          python tests/testdata/generate_complete_testdata.py

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          version: ${{ env.NFTEST_VERSION }}

      - name: Run nf-test stub suite
        # Container-free (-profile test) and stub-only (--tag stub): stub blocks
        # need no images. This is CI's blocking nf-test gate, and it was absent
        # from the release gate entirely.
        run: |
          nf-test test --tag stub --profile test --verbose

      - name: Upload nf-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-nf-test-stub-results
          path: |
            .nf-test/
            tests/output/

  # ===========================================================================
  # Gate job D - the DEEPCELL token-leak guard, mirroring ci.yml's
  # `security-tests`. It needs its own job for the reason ci.yml documents at
  # length: tests/modules/segment_deepcell_token.nf.test needs
  # `-profile test,singularity`, Nextflow rejects a duplicate `-profile`, and so
  # the `--tag stub --profile test` sweep can never collect it. Verified there
  # by dry-run: 0 deepcell tests matched. The second step asserts the guard was
  # COLLECTED, not merely that nf-test exited 0.
  # ===========================================================================
  test-security:
    name: Gate - Security tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the pinned release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Install Nextflow
        # Same pin as test-nf-test: nf-test's generated wrappers do not compile
        # under edge Nextflow's strict parser.
        uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.0'

      - name: Cache Nextflow plugins
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nextflow-plugins
          key: ${{ runner.os }}-nf-plugins-${{ hashFiles('nextflow.config') }}
          restore-keys: |
            ${{ runner.os }}-nf-plugins-

      - name: Provision Nextflow plugins
        run: |
          nextflow plugin install "$(sed -n "s/.*id '\(nf-schema@[0-9.]*\)'.*/\1/p" nextflow.config)"

      - name: Install Python for test data generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements/**'

      - name: Generate test data
        run: |
          # numpy and tifffile at the harmonised versions, taken from
          # requirements/constraints.txt -- the same file every container image reads. No
          # version is named here; there is nothing to keep in step by hand.
          pip install -r requirements/testdata.txt
          python tests/testdata/generate_complete_testdata.py

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          version: ${{ env.NFTEST_VERSION }}

      - name: Token-leak guard
        # Asserts DEEPCELL_ACCESS_TOKEN is forwarded BY NAME and its VALUE never
        # reaches .command.run, which is group-readable on a typical shared HPC
        # filesystem and is retained across -resume. The variable must be set in
        # the environment invoking nf-test: the test asserts on its presence
        # first, because without it SEGMENT never reaches the guarded branch and
        # the whole case would pass while checking nothing.
        env:
          DEEPCELL_ACCESS_TOKEN: dummy-token-value
        run: |
          nf-test test tests/modules/segment_deepcell_token.nf.test \
            --profile test,singularity --verbose

      - name: Assert the guard actually executed
        # A tag typo, a renamed file, or a --profile change would make nf-test
        # exit 0 having run nothing — which is the exact failure this job was
        # added to close, so it must not be able to recur here.
        env:
          DEEPCELL_ACCESS_TOKEN: dummy-token-value
        run: |
          n=$(nf-test test tests/modules/segment_deepcell_token.nf.test \
                --profile test,singularity --dry-run 2>&1 \
              | grep -ci "DEEPCELL_ACCESS_TOKEN" || true)
          echo "collected $n case(s)"
          test "$n" -ge 1

  # ===========================================================================
  # Gate job E - ruff, mirroring ci.yml's `ruff` job. `ruff check` only, not
  # `ruff format`: the repo is not format-normalized yet.
  # ===========================================================================
  test-ruff:
    name: Gate - Ruff lint
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the pinned release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements/**'

      - name: Install ruff
        # Pinned to the version used locally (see ruff.toml) so CI and local
        # `ruff check .` agree exactly.
        run: |
          pip install -r requirements/lint.txt

      - name: Run ruff check
        run: |
          ruff check .

  # ===========================================================================
  # Job 2 - THE GATE, as one job downstream can depend on. Mirrors ci.yml's
  # `all-tests`: it needs the same five jobs and, like it, treats anything that
  # is not `success` as a failure. `skipped` is NOT a pass here — a gate job
  # that silently stops running must block the release, not wave it through.
  # ===========================================================================
  test:
    name: Test Gate
    needs: [test-python, test-nextflow, test-nf-test, test-security, test-ruff]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check all gate jobs passed
        run: |
          if [ "${{ needs.test-python.result }}" != "success" ]; then
            echo "::error::Python tests failed"
            exit 1
          fi
          if [ "${{ needs.test-nextflow.result }}" != "success" ]; then
            echo "::error::Nextflow stub tests failed"
            exit 1
          fi
          if [ "${{ needs.test-nf-test.result }}" != "success" ]; then
            echo "::error::nf-test stub suite failed"
            exit 1
          fi
          if [ "${{ needs.test-security.result }}" != "success" ]; then
            echo "::error::Security tests failed"
            exit 1
          fi
          if [ "${{ needs.test-ruff.result }}" != "success" ]; then
            echo "::error::Ruff lint failed"
            exit 1
          fi
          echo "All release gate checks passed."

  # ===========================================================================
  # Job 3 - bump manifest.version, commit, and create+push the git tag.
  # Only on workflow_dispatch (on a published release the tag already exists).
  # ===========================================================================
  bump-and-tag:
    name: Bump & Tag
    needs: [validate, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    # checkout + sed + commit + tag push.
    timeout-minutes: 10
    # Pushes the version-bump commit + git tag to main.
    permissions:
      contents: write
    steps:
      - name: Checkout repository (main, full history)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to tag a commit the gate did not test
        # The gate ran on validate's pinned SHA. If main moved while the gate
        # was running, tagging HEAD would tag something no job here tested --
        # the same class of defect as the old `checkout ref: main` under a gate
        # that checked out github.ref, just narrower. Re-dispatch instead.
        run: |
          TESTED="${{ needs.validate.outputs.sha }}"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$TESTED" ]; then
            echo "::error::main is at $HEAD_SHA but the gate tested $TESTED."
            echo "Someone pushed to main while the release gate was running."
            echo "Re-run the release workflow so the gate tests what gets tagged."
            exit 1
          fi
          echo "main is at the tested commit: $HEAD_SHA"

      - name: Write version into nextflow.config manifest
        run: |
          VERSION_NO_V="${{ needs.validate.outputs.version_no_v }}"
          # Replace the manifest version line: version = '...'
          sed -i -E "s/(version[[:space:]]*=[[:space:]]*)'[^']*'/\1'${VERSION_NO_V}'/" nextflow.config
          echo "nextflow.config manifest version now:"
          grep -E "version[[:space:]]*=" nextflow.config | head -1

      - name: Configure git identity (github-actions bot)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        run: |
          VERSION_NO_V="${{ needs.validate.outputs.version_no_v }}"
          if git diff --quiet -- nextflow.config; then
            echo "nextflow.config already at $VERSION_NO_V; no commit needed."
          else
            git add nextflow.config
            git commit -m "🔖 Release ${VERSION_NO_V}"
            git push origin main
          fi

      - name: Create and push tag
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists; skipping creation."
          else
            git tag -a "$VERSION" -m "Release ${VERSION}"
            git push origin "$VERSION"
          fi

  # ===========================================================================
  # Verify (release trigger) - tag pre-exists, so just confirm the committed
  # config matches the tag instead of bumping. Checks out the TAG explicitly:
  # on this trigger `github.ref` happens to be the tag already, but a bare
  # checkout states no such requirement and is the same shape as the bug this
  # workflow's header describes.
  # ===========================================================================
  verify-config:
    name: Verify Config Matches Tag
    needs: [validate, test]
    runs-on: ubuntu-latest
    # checkout + one grep.
    timeout-minutes: 5
    if: github.event_name == 'release'
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.version }}

      - name: Check manifest.version matches the released tag
        run: |
          VERSION_NO_V="${{ needs.validate.outputs.version_no_v }}"
          CONFIG_VERSION=$(grep -E "version[[:space:]]*=" nextflow.config | head -1 | grep -oP "'\K[^']+")
          echo "Tag version:    $VERSION_NO_V"
          echo "Config version: $CONFIG_VERSION"
          if [ "$CONFIG_VERSION" != "$VERSION_NO_V" ]; then
            echo "::error::Version mismatch - nextflow.config has '$CONFIG_VERSION' but tag is '$VERSION_NO_V'."
            exit 1
          fi
          echo "Config matches tag."

  # ===========================================================================
  # Job 4 - build & push all container images to Docker Hub (one descriptive tag
  # per image). Reuses build-images.yml via workflow_call.
  #
  # `needs: bump-and-tag` and `ref: <tag>` are both load-bearing. The images pin
  # manifest.version into what modules/local/*.nf pull, so building them from an
  # un-bumped tree publishes mirage-<component>:1.0.0 built from a tree that
  # still says the previous version. A reusable workflow does its OWN checkout
  # and sees the CALLER's github.ref, so the tag has to be passed in explicitly;
  # build-images.yml takes it as its `ref` input.
  #
  # `needs: verify-config` is the third load-bearing one, and it covers the
  # `release: published` trigger, where nothing bumps anything: the operator
  # tagged the tree by hand, so nextflow.config can simply DISAGREE with the tag.
  # `verify-config` is what catches that, and `artifacts` re-checks it inline
  # before tarring -- but this job has no steps of its own to check anything in,
  # and it used to carry no dependency on `verify-config` either. A v1.0.0
  # release of a tree still saying 0.9.0 therefore went: verify-config RED,
  # artifacts RED, and ten images tagged 1.0.0 built from the 0.9.0 tree and
  # PUSHED. `verify-config` only runs on the release trigger, so it is skipped
  # on a dispatch and the clause has to tolerate that, exactly like bump-and-tag.
  # ===========================================================================
  publish-images:
    name: Publish Images
    needs: [validate, test, bump-and-tag, verify-config]
    # `always()` is what lets a SKIPPED bump-and-tag (the release: published
    # path, where the tag already exists) or a SKIPPED verify-config (the
    # workflow_dispatch path, where bump-and-tag writes the version) through; the
    # explicit result checks are what stop a FAILED gate coming through with it.
    if: >-
      always()
      && needs.validate.result == 'success'
      && needs.test.result == 'success'
      && (needs.bump-and-tag.result == 'success' || needs.bump-and-tag.result == 'skipped')
      && (needs.verify-config.result == 'success' || needs.verify-config.result == 'skipped')
    uses: ./.github/workflows/build-images.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      ref: ${{ needs.validate.outputs.version }}
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # ===========================================================================
  # Job 5 - build the release tar.gz archive, FROM THE TAG. This is the job the
  # audit caught: it used to carry `needs: [validate, test]` and a bare
  # checkout, so `mirage-v1.0.0.tar.gz` was tarred from the un-bumped tree, in
  # parallel with the bump, and shipped a nextflow.config still reading the
  # previous version.
  # ===========================================================================
  artifacts:
    name: Create Artifacts
    needs: [validate, test, bump-and-tag]
    runs-on: ubuntu-latest
    if: >-
      always()
      && needs.validate.result == 'success'
      && needs.test.result == 'success'
      && (needs.bump-and-tag.result == 'success' || needs.bump-and-tag.result == 'skipped')
    # tar of the working tree + artifact upload.
    timeout-minutes: 15
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.version }}

      - name: Assert the archive carries the released version
        # The tarball's whole failure mode is silent: a wrong nextflow.config
        # inside a correctly-named .tar.gz. Check it before tarring rather than
        # discovering it from a user's bug report.
        run: |
          VERSION_NO_V="${{ needs.validate.outputs.version_no_v }}"
          CONFIG_VERSION=$(grep -E "version[[:space:]]*=" nextflow.config | head -1 | grep -oP "'\K[^']+")
          if [ "$CONFIG_VERSION" != "$VERSION_NO_V" ]; then
            echo "::error::Archive would ship nextflow.config version '$CONFIG_VERSION' for release '$VERSION_NO_V'."
            exit 1
          fi
          echo "Archive tree is at version $CONFIG_VERSION."

      - name: Create release archive
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          ARCHIVE_NAME="mirage-${VERSION}.tar.gz"

          # Write the archive OUTSIDE the tree being archived, then move it back.
          #
          # `tar -czf "$ARCHIVE_NAME" .` writes the archive INTO the directory it is
          # reading, so the directory grows while tar walks it and GNU tar exits 1 with
          # "tar: .: file changed as we read it". That is not cosmetic: it failed the
          # v1.0.0 release's Create Artifacts job while every other job passed. tar's
          # own --exclude cannot help, because the exclusion is evaluated against the
          # walk, not against the write.
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='.nf-test' \
              --exclude='work' \
              --exclude='test_results*' \
              --exclude='*.log' \
              --exclude='__pycache__' \
              --exclude='.pytest_cache' \
              -czvf "${RUNNER_TEMP}/${ARCHIVE_NAME}" .
          mv "${RUNNER_TEMP}/${ARCHIVE_NAME}" "./${ARCHIVE_NAME}"

          echo "Created archive: $ARCHIVE_NAME"
          ls -lh "$ARCHIVE_NAME"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: mirage-*.tar.gz

  # ===========================================================================
  # Release notes - attach the archive and append notes to the GitHub release.
  # Only meaningful on the release:published trigger (preserved behavior).
  # ===========================================================================
  release-notes:
    name: Update Release Notes
    needs: [validate, test, artifacts]
    runs-on: ubuntu-latest
    # Two GitHub API uploads.
    timeout-minutes: 10
    if: github.event_name == 'release'
    # Uploads the archive + appends the release body to the GitHub release.
    permissions:
      contents: write
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.version }}

      - name: Download release archive
        uses: actions/download-artifact@v4
        with:
          name: release-archive

      - name: Upload archive to release
        uses: softprops/action-gh-release@v1
        with:
          files: mirage-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release body
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## MIRAGE Pipeline Release ${{ needs.validate.outputs.version }}

            ### Installation

            ```bash
            # Clone the repository
            git clone https://github.com/${{ github.repository }}.git
            cd mirage

            # Or download the release archive
            wget https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.version }}/mirage-${{ needs.validate.outputs.version }}.tar.gz
            ```

            ### Container images

            Published to Docker Hub under `bolt3x/mirage-<component>:1.0.0` (one descriptive tag per image).

            ### Quick Start

            ```bash
            nextflow run . -profile test,docker --outdir results
            ```

            ### Requirements

            - Nextflow >= 25.04.0
            - Docker or Singularity

            ---

            *This release was automatically tested and packaged by GitHub Actions.*
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
