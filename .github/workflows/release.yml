# =============================================================================
# Release (test-gated, tag-driven)
# =============================================================================
# A release is gated on the SAME checks CI runs. Nothing downstream (version
# bump, git tag, image publish, artifacts) happens unless the test job passes.
#
# Two entry points:
#   * workflow_dispatch (input: version) -> the full flow: validate -> test ->
#     bump-and-tag (writes manifest.version, commits, creates+pushes the tag) ->
#     publish-images + artifacts + release-notes.
#   * release:published -> the tag already exists, so bump-and-tag is skipped;
#     we still validate, run the test gate, verify the config matches the tag,
#     publish images and attach artifacts/notes.
# =============================================================================
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.0.0)'
        required: true
        type: string

# Least-privilege default: read-only. The two jobs that write (bump-and-tag,
# release-notes) escalate explicitly per-job below. publish-images pushes to
# Docker Hub via DOCKERHUB_* secrets (no extra GITHUB_TOKEN scope needed).
permissions:
  contents: read

# Serialize releases per ref but NEVER cancel one in flight — a half-published
# release (tag pushed, images missing) is worse than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Job 1 - validate the requested/release version string.
  # ===========================================================================
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    # A regex check on one string. Anything slower than this is a wedged runner.
    timeout-minutes: 5
    outputs:
      version: ${{ steps.get_version.outputs.version }}        # e.g. v1.0.0
      version_no_v: ${{ steps.get_version.outputs.version_no_v }}  # e.g. 1.0.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_no_v=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Validate version format (FAIL on bad format)
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: '$VERSION'. Expected vX.Y.Z (e.g. v1.0.0)."
            exit 1
          fi
          echo "Version format OK: $VERSION"

  # ===========================================================================
  # Job 2 - THE GATE. Runs the same checks as ci.yml. If this fails, nothing
  # downstream runs (no bump, no tag, no images, no artifacts).
  # ===========================================================================
  test:
    name: Test Gate
    needs: validate
    runs-on: ubuntu-latest
    # The heaviest job here: the full pytest suite + the 11-run validation script
    # + a stub pipeline run. ci.yml budgets 30 min for python-tests and 30 for the
    # stub job; this job is both, so 60.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Nextflow
        uses: actions/cache@v4
        with:
          path: ~/.nextflow
          key: ${{ runner.os }}-nextflow-release-${{ hashFiles('**/*.nf') }}
          restore-keys: |
            ${{ runner.os }}-nextflow-

      - name: Install Nextflow (>=25.04.0)
        uses: nf-core/setup-nextflow@v2
        with:
          version: 'latest-everything'

      # NOTE: no `docker/setup-buildx-action` here on purpose. Every step in this
      # job is container-free — pytest, the validation script, and a `-profile test
      # -stub` run (stub blocks only `touch` outputs). Setting up buildx bought
      # nothing but runtime, and the image build that genuinely needs it happens in
      # the `publish-images` job (build-images.yml). Guarded by
      # tests/test_ci_job_hygiene.py::test_buildx_job_must_actually_use_buildx.
      # `cache: 'pip'` keys on the hash of **/requirements.txt -- which includes
      # containers/tiled/requirements.txt, the file that DOCUMENTS the torch/kornia split
      # (they are installed by an inline `pip install` below, not from any requirements
      # file, because torch needs a CPU --index-url and kornia must follow it). So the
      # ~190 MB torch wheel is cached, but the key rotates only when some requirements.txt
      # changes -- NOT when the inline pins below change. If you bump torch or kornia here,
      # touch containers/tiled/requirements.txt's comment in the same commit or the first
      # run after the bump restores a cache built for the old wheel.
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Pinned for the reason .github/workflows/ci.yml gives at its own scikit-learn
          # pin: bin/utils/cse/functions.py:650 builds its PCA model by assigning fitted
          # attributes by hand, so it is valid only against the sklearn internals it was
          # written for. Unpinned, pip resolved 1.7.2 on a 3.10 leg and 1.9.0 on a 3.11 leg
          # and 1.9.0 made QualityScore come out `nan`. Tracks
          # containers/segeval/requirements.txt.
          pip install pytest pytest-cov pandas scikit-learn==1.5.2 xmltodict
          # The imaging stack is pinned to containers/tiled/requirements.txt — the
          # production image that actually runs the tiled path — and installed in one
          # command, exactly as ci.yml's python-tests job does. This gate claims to run
          # "the SAME checks CI runs"; installing an UNPINNED tifffile/numpy/
          # scikit-image here (as it used to) meant it resolved a different stack than
          # both CI and the container, which is the class of bug that produced a blank
          # thumbnail (intensity p1/p50/p99.9 = 0.0/0.0/0.0) and `RuntimeError: ORB
          # found no features.` on unrelated tiled tests.
          # tests/test_ci_stack_pinned.py globs EVERY workflow under .github/workflows/
          # and guards this pin; it used to look only at ci.yml, which is how this line
          # stayed unpinned.
          #
          # imagecodecs supplies the zstd/LZW codecs tifffile calls through, and belongs on
          # THIS line rather than one of its own so the resolver never gets a window in
          # which it can move the stack. Its absence is not an ImportError at import time --
          # it surfaces only when something WRITES with a codec, as `ModuleNotFoundError: No
          # module named 'compression'` raised from inside tifffile. This line used to stop
          # at numcodecs while ci.yml's counterpart -- identical apart from this one token
          # -- carried imagecodecs, and tests/test_ci_stack_pinned.py's presence check was
          # a UNION across workflows, so ci.yml satisfied it on this file's behalf, in a
          # gate ci.yml does not run. Measured cost of the omission in this
          # gate: 13 failed / 1072 passed against ci.yml's 1115 passed. Authority:
          # containers/tiled/requirements.txt.
          pip install numpy==1.26.4 scipy==1.15.3 scikit-image==0.25.2 tifffile==2025.5.10 zarr==2.18.3 numcodecs==0.13.1 imagecodecs==2025.3.30
          # torch + kornia power STARE's DISK+LightGlue COARSE front-end
          # (bin/utils/coarse_align.py). Without them tests/test_coarse_frontend.py's DISK
          # case importorskips and proves nothing -- which is how an unimplemented
          # front-end shipped once already. tests/test_disk_test_actually_runs.py asserts
          # these two lines exist.
          #
          # CPU wheel and torch-before-kornia, matching containers/tiled/Dockerfile: kornia
          # pulls the ~2.5 GB CUDA wheel from PyPI if torch is not already satisfied.
          pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          pip install kornia==0.7.3
          # matplotlib is a hard dependency of the CSE evaluation path, not a plotting
          # nicety: the vendored CSE source runs `import matplotlib.pyplot` at the top of
          # functions.py's foreground_separation(), which single_method_eval.py calls on
          # the main path. Without it bin/seg_quality_eval.py exits 1 and
          # tests/test_seg_quality_eval_cli.py fails -- which is exactly what this gate did
          # while ci.yml, which installs it, stayed green.
          #
          # Pinned to segeval's version, NOT to containers/tiled's -- the tiled image
          # neither pins nor imports matplotlib. containers/segeval/requirements.txt is the
          # authority and explains it at length; tests/test_ci_stack_pinned.py encodes the
          # split.
          pip install matplotlib==3.8.4
          # dask[array] powers bin/convert_image.py's lazy read: BioImage.dask_data is a
          # dask array, and tests/test_convert_lazy_read.py +
          # tests/test_convert_streaming_write.py import dask.array UNCONDITIONALLY, so
          # this gate needs it too. Same pin as ci.yml and as containers/stardist,
          # containers/cellsam and containers/convert: 2026.7.1. (This job is
          # single-version Python 3.10 -- see python-version above -- so no matrix
          # consideration applies here; an earlier draft of this comment claimed a 3.9 leg
          # that this job has never had.)
          pip install 'dask[array]==2026.7.1'
          # bin/utils/qc.py imports cv2 at module scope, and this runner has no display
          # libs, so -headless, not opencv-python (containers/regqc/requirements.txt's
          # runtime pin). Pinned to the same 4.10.0.82 release that container installs, and
          # to a build compatible with numpy==1.26.4 above -- opencv-python-headless>=5
          # requires numpy>=2 and would break the pin the imaging-stack line exists to
          # protect.
          #
          # Its absence here was SILENT, not loud: tests/test_merge_pyramid_streaming.py
          # and tests/test_registration_qc_lazy_read.py call pytest.importorskip("cv2") at
          # MODULE scope, so 24 + 5 tests were deselected from this gate without a single
          # failure to show for it. That is why cv2's distribution is now in
          # tests/test_ci_stack_pinned.py's IMPORTORSKIP_GUARDED set.
          pip install opencv-python-headless==4.10.0.82
          # anndata powers tests/test_join_flowpath.py. Capped below 0.12: anndata >= 0.12
          # requires zarr >= 3, which breaks tifffile's aszarr store used by the tiled
          # tests. 0.11.x works with zarr 2 and is all these tests need — they only build
          # in-memory AnnData. A failed install now fails this release gate, same as ci.yml.
          pip install 'anndata<0.12'

      - name: Generate test data
        run: |
          python tests/testdata/generate_complete_testdata.py

      # --- Same Python tests CI runs ---
      # A skip is not a pass. tests/test_coarse_frontend.py's DISK+LightGlue cases
      # guard themselves with importorskip("torch")/importorskip("kornia"), so a
      # missing, broken or CUDA-only install turns them into silent skips -- which is
      # how an unimplemented front-end shipped once already. This step proves both
      # libraries import in the SAME interpreter pytest runs in, and then proves the
      # file reports ZERO skips. tests/test_disk_test_actually_runs.py asserts this
      # step exists in every workflow that runs the pytest suite.
      - name: Assert the DISK front-end test is not skipped
        run: |
          set -euo pipefail
          python -c "import torch, kornia; print(torch.__version__, kornia.__version__)"
          pytest tests/test_coarse_frontend.py -rs -q | tee coarse_frontend.log
          if grep -qi 'skipped' coarse_frontend.log; then
            echo "::error::tests/test_coarse_frontend.py reported a SKIP -- the DISK+LightGlue case did not run"
            exit 1
          fi

      - name: Run Python tests
        run: |
          pytest -v tests/ \
            --ignore=tests/testdata \
            --ignore=tests/modules \
            --ignore=tests/subworkflows \
            --ignore=tests/integration

      # --- Same validation script CI runs ---
      - name: Run validation tests
        run: |
          bash tests/run_validation_tests.sh

      # --- Same stub pipeline run CI runs (container-free: stub needs no
      #     images, and this gate runs BEFORE publish-images on a fresh tag). ---
      - name: Run pipeline stub
        run: |
          nextflow run . \
            -profile test \
            -stub \
            --outdir test_results_stub

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: |
            test_results_stub/
            .nextflow.log

  # ===========================================================================
  # Job 3 - bump manifest.version, commit, and create+push the git tag.
  # Only on workflow_dispatch (on a published release the tag already exists).
  # ===========================================================================
  bump-and-tag:
    name: Bump & Tag
    needs: [validate, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    # checkout + sed + commit + tag push.
    timeout-minutes: 10
    # Pushes the version-bump commit + git tag to main.
    permissions:
      contents: write
    steps:
      - name: Checkout repository (main, full history)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write version into nextflow.config manifest
        run: |
          VERSION_NO_V="${{ needs.validate.outputs.version_no_v }}"
          # Replace the manifest version line: version = '...'
          sed -i -E "s/(version[[:space:]]*=[[:space:]]*)'[^']*'/\1'${VERSION_NO_V}'/" nextflow.config
          echo "nextflow.config manifest version now:"
          grep -E "version[[:space:]]*=" nextflow.config | head -1

      - name: Configure git identity (github-actions bot)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        run: |
          VERSION_NO_V="${{ needs.validate.outputs.version_no_v }}"
          if git diff --quiet -- nextflow.config; then
            echo "nextflow.config already at $VERSION_NO_V; no commit needed."
          else
            git add nextflow.config
            git commit -m "🔖 Release ${VERSION_NO_V}"
            git push origin main
          fi

      - name: Create and push tag
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists; skipping creation."
          else
            git tag -a "$VERSION" -m "Release ${VERSION}"
            git push origin "$VERSION"
          fi

  # ===========================================================================
  # Verify (release trigger) - tag pre-exists, so just confirm the committed
  # config matches the tag instead of bumping.
  # ===========================================================================
  verify-config:
    name: Verify Config Matches Tag
    needs: [validate, test]
    runs-on: ubuntu-latest
    # checkout + one grep.
    timeout-minutes: 5
    if: github.event_name == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check manifest.version matches the released tag
        run: |
          VERSION_NO_V="${{ needs.validate.outputs.version_no_v }}"
          CONFIG_VERSION=$(grep -E "version[[:space:]]*=" nextflow.config | head -1 | grep -oP "'\K[^']+")
          echo "Tag version:    $VERSION_NO_V"
          echo "Config version: $CONFIG_VERSION"
          if [ "$CONFIG_VERSION" != "$VERSION_NO_V" ]; then
            echo "::error::Version mismatch - nextflow.config has '$CONFIG_VERSION' but tag is '$VERSION_NO_V'."
            exit 1
          fi
          echo "Config matches tag."

  # ===========================================================================
  # Job 4 - build & push all container images to Docker Hub (one descriptive tag
  # per image). Reuses build-images.yml via workflow_call. Gated on the test job.
  # ===========================================================================
  publish-images:
    name: Publish Images
    needs: [validate, test]
    uses: ./.github/workflows/build-images.yml
    with:
      version: ${{ needs.validate.outputs.version }}
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # ===========================================================================
  # Job 5 - build the release tar.gz archive (preserved from the previous
  # release.yml). Gated on the test job.
  # ===========================================================================
  artifacts:
    name: Create Artifacts
    needs: [validate, test]
    runs-on: ubuntu-latest
    # tar of the working tree + artifact upload.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release archive
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          ARCHIVE_NAME="mirage-${VERSION}.tar.gz"

          # Create archive excluding development files.
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='.nf-test' \
              --exclude='work' \
              --exclude='test_results*' \
              --exclude='*.log' \
              --exclude='__pycache__' \
              --exclude='.pytest_cache' \
              -czvf "$ARCHIVE_NAME" .

          echo "Created archive: $ARCHIVE_NAME"
          ls -lh "$ARCHIVE_NAME"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: mirage-*.tar.gz

  # ===========================================================================
  # Release notes - attach the archive and append notes to the GitHub release.
  # Only meaningful on the release:published trigger (preserved behavior).
  # ===========================================================================
  release-notes:
    name: Update Release Notes
    needs: [validate, test, artifacts]
    runs-on: ubuntu-latest
    # Two GitHub API uploads.
    timeout-minutes: 10
    if: github.event_name == 'release'
    # Uploads the archive + appends the release body to the GitHub release.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release archive
        uses: actions/download-artifact@v4
        with:
          name: release-archive

      - name: Upload archive to release
        uses: softprops/action-gh-release@v1
        with:
          files: mirage-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release body
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## MIRAGE Pipeline Release ${{ needs.validate.outputs.version }}

            ### Installation

            ```bash
            # Clone the repository
            git clone https://github.com/${{ github.repository }}.git
            cd mirage

            # Or download the release archive
            wget https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.version }}/mirage-${{ needs.validate.outputs.version }}.tar.gz
            ```

            ### Container images

            Published to Docker Hub under `bolt3x/mirage-<component>:1.0.0` (one descriptive tag per image).

            ### Quick Start

            ```bash
            nextflow run . -profile test,docker --outdir results
            ```

            ### Requirements

            - Nextflow >= 25.04.0
            - Docker or Singularity

            ---

            *This release was automatically tested and packaged by GitHub Actions.*
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
