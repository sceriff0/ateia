name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

# Least-privilege default token: read-only. Hardens against a compromised
# action writing to the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes; a new push to a PR
# branch kills the previous in-flight run instead of stacking them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NFTEST_VERSION: '0.9.0'
  # Nextflow plugins (nf-schema, which enforces nextflow_schema.json) are
  # downloaded from the plugin registry on first use. Point every job at one
  # cacheable directory instead of ~/.nextflow/plugins so the download happens
  # once, not once per job per push. This is the same NXF_PLUGINS_DIR mechanism
  # docs/usage.md documents for air-gapped clusters, so CI exercises it.
  NXF_PLUGINS_DIR: ${{ github.workspace }}/.nextflow-plugins

jobs:
  # ============================================================================
  # Python unit tests
  # ============================================================================
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt || true
          fi
          pip install pytest pytest-cov pandas scikit-learn xmltodict
          # The imaging stack (numpy/scipy/scikit-image/tifffile/zarr/numcodecs) is
          # pinned to containers/tiled/requirements.txt — the production image that
          # actually runs the tiled path — and installed together in one command so
          # there is no resolver window where an unpinned package can drag in a
          # version incompatible with the others. This used to be two separate `pip
          # install`s (an unpinned tifffile/numpy/scikit-image/scipy first, then
          # zarr/numcodecs pinned "LAST so it wins"), which let CI resolve a tifffile
          # requiring zarr>=3.2 and then force-downgrade zarr back to 2.18.3 afterward
          # — an inconsistent install that read a blank thumbnail (intensity
          # p1/p50/p99.9 = 0.0/0.0/0.0) and failed unrelated tiled tests with
          # `RuntimeError: ORB found no features.` tests/test_ci_stack_pinned.py
          # guards this pin against re-diverging from containers/tiled/requirements.txt.
          #
          # zarr/numcodecs must be pinned together: tests/test_tiled_stitch_streaming.py
          # imports bin/utils/tiled_io.py, which imports zarr, and a newer numcodecs
          # drops blosc.cbuffer_sizes that zarr 2.18 imports — so the test module fails
          # at COLLECTION with `from zarr.meta import Metadata2, Metadata3`, taking the
          # whole job down rather than failing one test.
          pip install numpy==1.26.4 scipy==1.15.3 scikit-image==0.25.2 tifffile==2025.5.10 zarr==2.18.3 numcodecs==0.13.1
          # anndata powers tests/test_join_flowpath.py. Tolerated as optional because
          # anndata has dropped Python 3.9, which this matrix still covers; the test
          # module pytest.importorskip's it, so an unavailable anndata skips those
          # tests instead of failing the job.
          #
          # Capped below 0.12: anndata >= 0.12 requires zarr >= 3, and zarr 3 removes the
          # store API tifffile's aszarr relies on (`Unsupported type for store_like:
          # 'ZarrTiffStore'`), which breaks the tiled streaming/fanout tests. 0.11.x works
          # with zarr 2 and is all these tests need — they only build in-memory AnnData.
          pip install 'anndata<0.12' || echo "anndata unavailable on Python ${{ matrix.python-version }} — test_join_flowpath will skip"

      - name: Generate test data
        run: |
          python tests/testdata/generate_complete_testdata.py

      - name: Run Python unit tests
        run: |
          pytest -v tests/ --ignore=tests/testdata --ignore=tests/modules --ignore=tests/subworkflows --ignore=tests/integration \
            --cov=bin --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================================
  # Nextflow stub tests + validation (fast, every push/PR)
  # ============================================================================
  nextflow-stub:
    name: NF ${{ matrix.nextflow-version }} stub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        nextflow-version: ['25.04.0', 'latest-everything']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Nextflow
        uses: actions/cache@v4
        with:
          path: |
            ~/.nextflow
            ~/.nf-test
          key: ${{ runner.os }}-nextflow-${{ matrix.nextflow-version }}-${{ hashFiles('**/*.nf') }}
          restore-keys: |
            ${{ runner.os }}-nextflow-${{ matrix.nextflow-version }}-
            ${{ runner.os }}-nextflow-

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nextflow-version }}

      - name: Cache Nextflow plugins
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nextflow-plugins
          key: ${{ runner.os }}-nf-plugins-${{ hashFiles('nextflow.config') }}
          restore-keys: |
            ${{ runner.os }}-nf-plugins-

      - name: Provision Nextflow plugins
        # Install the pinned nf-schema explicitly so a registry outage fails in
        # a step that names it, instead of halfway into a pipeline run. The
        # version is read out of nextflow.config rather than duplicated here, so
        # CI and the pipeline cannot pin different versions. No-op when the
        # cache above already restored it.
        run: |
          nextflow plugin install "$(sed -n "s/.*id '\(nf-schema@[0-9.]*\)'.*/\1/p" nextflow.config)"

      - name: Install Python for test data generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Generate test data
        run: |
          # Pinned to containers/tiled/requirements.txt (the production tiled-path
          # image) — guarded by tests/test_ci_stack_pinned.py, which requires every
          # `pip install` of a guarded imaging package, in every job, to match.
          pip install numpy==1.26.4 tifffile==2025.5.10
          python tests/testdata/generate_complete_testdata.py

      - name: Check all profiles parse without the gitignored site config
        # Guards against the strict-parser regression class: a committed profile
        # must never includeConfig a gitignored/missing file (breaks every
        # profile in CI). Runs with conf/ieo.config absent (it already is in CI).
        run: |
          bash tests/check_profiles_parse.sh

      - name: Check param surface consistency (config <-> schema <-> code)
        # Fails if a param is declared/used but undocumented in nextflow_schema.json
        # (or vice-versa) — keeps the parameter surface from drifting.
        run: |
          python3 tests/check_param_consistency.py

      - name: Run pipeline validation tests
        run: |
          bash tests/run_validation_tests.sh

      - name: lib/ probe — assert lib/*.groovy behaviour
        # The unit-test surface for lib/*.groovy. Assertions live inside the
        # script because nf-test's assertion context cannot see lib/ classes.
        # A failing assert exits nonzero and fails this blocking job.
        run: |
          nextflow run tests/lib_probe.nf -lib lib

      - name: Run pipeline with test profile (stub mode)
        # Stub blocks only `touch` outputs — no container engine needed. Running
        # container-free keeps stub CI green without pulling per-process images
        # (real container behaviour is exercised by the nf-test real suite).
        run: |
          nextflow run . \
            -profile test \
            -stub \
            --outdir test_results_stub

      - name: Upload stub test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stub-results-nf-${{ matrix.nextflow-version }}
          path: |
            test_results_stub/
            .nextflow.log

  # ============================================================================
  # nf-test stub suite (fast, every push/PR)
  # ============================================================================
  nf-test-stub:
    name: nf-test (stub)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Nextflow
        uses: actions/cache@v4
        with:
          path: ~/.nextflow
          key: ${{ runner.os }}-nextflow-${{ hashFiles('**/*.nf') }}
          restore-keys: |
            ${{ runner.os }}-nextflow-

      - name: Install Nextflow
        # Pinned to the supported release: nf-test 0.9.0's generated test
        # wrappers do not compile under edge Nextflow's strict parser.
        # latest-everything full-pipeline compatibility is covered by the
        # nextflow-stub job's matrix.
        uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.0'

      - name: Cache Nextflow plugins
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nextflow-plugins
          key: ${{ runner.os }}-nf-plugins-${{ hashFiles('nextflow.config') }}
          restore-keys: |
            ${{ runner.os }}-nf-plugins-

      - name: Provision Nextflow plugins
        # Install the pinned nf-schema explicitly so a registry outage fails in
        # a step that names it, instead of halfway into a pipeline run. The
        # version is read out of nextflow.config rather than duplicated here, so
        # CI and the pipeline cannot pin different versions. No-op when the
        # cache above already restored it.
        run: |
          nextflow plugin install "$(sed -n "s/.*id '\(nf-schema@[0-9.]*\)'.*/\1/p" nextflow.config)"

      - name: Install Python for test data generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Generate test data
        run: |
          # Pinned to containers/tiled/requirements.txt (the production tiled-path
          # image) — guarded by tests/test_ci_stack_pinned.py, which requires every
          # `pip install` of a guarded imaging package, in every job, to match.
          pip install numpy==1.26.4 tifffile==2025.5.10
          python tests/testdata/generate_complete_testdata.py

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          version: ${{ env.NFTEST_VERSION }}

      - name: Run nf-test stub suite
        # Container-free (-profile test) and stub-only (--tag stub): stub blocks
        # need no images. Real cases are tagged "real" and run in the nf-test
        # real job once GHCR images are published (avoids pulling images that do
        # not exist yet on a PR).
        run: |
          nf-test test --tag stub --profile test --verbose

      - name: Upload nf-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nf-test-stub-results
          path: |
            .nf-test/
            tests/output/

  # ============================================================================
  # nf-test real suite (runs on push to main/dev only)
  # ============================================================================
  nf-test-real:
    name: nf-test (real)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    # ADVISORY. Registration, segmentation model-loading, and most test-staging
    # bugs are fixed (suite went 26 -> ~20 failing); the remaining failures are
    # the synthetic-data segmentation wall: StarDist's built-in 2D_versatile_fluo
    # detects 0 nuclei in the smooth synthetic test blobs even at a low
    # prob_thresh, so cell/quant/geojson assertions can't pass on this fixture
    # data. Tracked for a follow-up (bundle a tiny real nuclei crop, or switch
    # those assertions to "runs without error"). Flip to blocking once green.
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Nextflow
        uses: actions/cache@v4
        with:
          path: ~/.nextflow
          key: ${{ runner.os }}-nextflow-real-${{ hashFiles('**/*.nf') }}
          restore-keys: |
            ${{ runner.os }}-nextflow-

      - name: Install Nextflow
        # Pinned to the supported release: nf-test 0.9.0's generated test
        # wrappers do not compile under edge Nextflow's strict parser.
        # latest-everything full-pipeline compatibility is covered by the
        # nextflow-stub job's matrix.
        uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.0'

      - name: Cache Nextflow plugins
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nextflow-plugins
          key: ${{ runner.os }}-nf-plugins-${{ hashFiles('nextflow.config') }}
          restore-keys: |
            ${{ runner.os }}-nf-plugins-

      - name: Provision Nextflow plugins
        # Install the pinned nf-schema explicitly so a registry outage fails in
        # a step that names it, instead of halfway into a pipeline run. The
        # version is read out of nextflow.config rather than duplicated here, so
        # CI and the pipeline cannot pin different versions. No-op when the
        # cache above already restored it.
        run: |
          nextflow plugin install "$(sed -n "s/.*id '\(nf-schema@[0-9.]*\)'.*/\1/p" nextflow.config)"

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install Python for test data generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Generate test data
        run: |
          # Pinned to containers/tiled/requirements.txt (the production tiled-path
          # image) — guarded by tests/test_ci_stack_pinned.py, which requires every
          # `pip install` of a guarded imaging package, in every job, to match.
          pip install numpy==1.26.4 tifffile==2025.5.10
          python tests/testdata/generate_complete_testdata.py

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          version: ${{ env.NFTEST_VERSION }}

      - name: Run nf-test real suite
        run: |
          nf-test test --profile test,docker --tag real --verbose

      - name: Upload nf-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nf-test-real-results
          path: |
            .nf-test/
            tests/output/

  # ============================================================================
  # nf-test integration suite (manual trigger only)
  # ============================================================================
  nf-test-integration:
    name: nf-test (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        # Pinned to the supported release: nf-test 0.9.0's generated test
        # wrappers do not compile under edge Nextflow's strict parser.
        # latest-everything full-pipeline compatibility is covered by the
        # nextflow-stub job's matrix.
        uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.0'

      - name: Cache Nextflow plugins
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nextflow-plugins
          key: ${{ runner.os }}-nf-plugins-${{ hashFiles('nextflow.config') }}
          restore-keys: |
            ${{ runner.os }}-nf-plugins-

      - name: Provision Nextflow plugins
        # Install the pinned nf-schema explicitly so a registry outage fails in
        # a step that names it, instead of halfway into a pipeline run. The
        # version is read out of nextflow.config rather than duplicated here, so
        # CI and the pipeline cannot pin different versions. No-op when the
        # cache above already restored it.
        run: |
          nextflow plugin install "$(sed -n "s/.*id '\(nf-schema@[0-9.]*\)'.*/\1/p" nextflow.config)"

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install Python for test data generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Generate test data
        run: |
          # Pinned to containers/tiled/requirements.txt (the production tiled-path
          # image) — guarded by tests/test_ci_stack_pinned.py, which requires every
          # `pip install` of a guarded imaging package, in every job, to match.
          pip install numpy==1.26.4 tifffile==2025.5.10
          python tests/testdata/generate_complete_testdata.py

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          version: ${{ env.NFTEST_VERSION }}

      - name: Run nf-test integration suite
        run: |
          nf-test test --profile test,docker --tag integration --verbose

      - name: Upload nf-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nf-test-integration-results
          path: |
            .nf-test/
            tests/output/

  # ============================================================================
  # Python lint (blocking) — ruff check only, not ruff format. The repo is not
  # format-normalized yet, so format enforcement is deliberately out of scope;
  # this job only fails the build on actual lint errors (pyflakes/pycodestyle/
  # import-sort per ruff.toml).
  # ============================================================================
  ruff:
    name: Ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install ruff
        # Pinned to the version used locally (see ruff.toml) so CI and local
        # `ruff check .` agree exactly.
        run: |
          pip install ruff==0.16.0

      - name: Run ruff check
        run: |
          ruff check .

  # ============================================================================
  # Linting (nf-core structure lint — advisory, not a merge gate)
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        # Pin to the supported release for deterministic lint (matches the rest
        # of the suite); avoids edge-Nextflow surprises in advisory linting.
        uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.0'

      - name: Install nf-core tools
        run: |
          pip install 'nf-core<3.5'

      - name: Run nf-core lint
        run: |
          nf-core lint --dir . || true  # nf-core lint is advisory, not blocking

  # ============================================================================
  # All tests passed gate
  # ============================================================================
  all-tests:
    name: All Tests
    # `lint` (nf-core structure lint) is deliberately NOT in this list: it
    # always exits 0 (`|| true`, kept advisory on purpose — see the lint job
    # above), so including it here would be a fake gate that can never fail.
    # `ruff` is the real, blocking Python lint gate.
    needs: [python-tests, nextflow-stub, nf-test-stub, ruff]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.python-tests.result }}" != "success" ] && [ "${{ needs.python-tests.result }}" != "skipped" ]; then
            echo "Python tests failed"
            exit 1
          fi
          if [ "${{ needs.nextflow-stub.result }}" != "success" ] && [ "${{ needs.nextflow-stub.result }}" != "skipped" ]; then
            echo "Nextflow stub tests failed"
            exit 1
          fi
          if [ "${{ needs.nf-test-stub.result }}" != "success" ] && [ "${{ needs.nf-test-stub.result }}" != "skipped" ]; then
            echo "nf-test stub failed"
            exit 1
          fi
          if [ "${{ needs.ruff.result }}" != "success" ] && [ "${{ needs.ruff.result }}" != "skipped" ]; then
            echo "Ruff lint failed"
            exit 1
          fi
          echo "All required tests passed!"
