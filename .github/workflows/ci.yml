name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

# Least-privilege default token: read-only. Hardens against a compromised
# action writing to the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes; a new push to a PR
# branch kills the previous in-flight run instead of stacking them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NFTEST_VERSION: '0.9.0'
  # Nextflow plugins (nf-schema, which enforces nextflow_schema.json) are
  # downloaded from the plugin registry on first use. Point every job at one
  # cacheable directory instead of ~/.nextflow/plugins so the download happens
  # once, not once per job per push. This is the same NXF_PLUGINS_DIR mechanism
  # docs/usage.md documents for air-gapped clusters, so CI exercises it.
  NXF_PLUGINS_DIR: ${{ github.workspace }}/.nextflow-plugins

jobs:
  # ============================================================================
  # Python unit tests
  # ============================================================================
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.9 was dropped 2026-08-17. Nothing that ships runs it: every container image
        # is Python 3.10 or newer (containers/convert is 3.10, containers/spatialdata is
        # 3.12). Carrying it cost real fidelity -- it was the sole reason CI's dask had to
        # be pinned two years behind the version production runs, and the sole reason
        # anndata was installed "optionally" with a `|| echo` fallback.
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # `cache-dependency-path` is NOT optional now that the pins live in requirements/.
      # `cache: 'pip'` defaults its key to the hash of `**/requirements.txt`, and after the
      # move the only files matching that glob are the root shim and docs/requirements.txt
      # -- neither of which changes when a pin does. The cache key would have gone stale
      # exactly when it must rotate: the run after a bump would restore a cache built for
      # the OLD wheels (~190 MB of torch among them). Keying on requirements/** rotates it
      # on any pin change, including torch's and kornia's, which the old `**/requirements.txt`
      # key never did.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements/**'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # EVERY version string lives in requirements/, never here. That is not a style
          # preference: the same pins used to be written twice -- once in this YAML and
          # once in the production image -- and a 42 KB guard test existed only to prove
          # the two copies were equal. requirements/ci.txt `-r`-includes
          # requirements/segeval.txt and requirements/tiled.txt, the very files
          # containers/segeval and containers/tiled build from, so there is one copy and
          # nothing left to prove equal. Read requirements/ci.txt: it documents what this
          # environment is, and the one place (anndata) where it honestly cannot match a
          # shipped image.
          #
          # There is deliberately NO `pip install -r requirements.txt` (the ROOT file).
          # It is an unpinned developer-convenience superset carrying a
          # `git+https://github.com/vanvalenlab/deepcell-types@master` clone that does not
          # install on Python 3.10 at all, and it was once installed in this BLOCKING gate
          # with `|| true`, so total failure was swallowed. The root file is now a shim
          # that points at requirements/ci.txt and says so.
          #
          # tests/test_ci_stack_pinned.py asserts that no workflow names a package version
          # anywhere -- a closed rule with no package list to keep up to date.
          pip install -r requirements/ci.txt
          # torch + kornia power STARE's DISK+LightGlue COARSE front-end
          # (bin/utils/coarse_align.py). Without them tests/test_coarse_frontend.py's DISK
          # cases importorskip and prove nothing -- which is how an unimplemented front-end
          # shipped once already. tests/test_disk_test_actually_runs.py asserts these two
          # lines exist in every workflow that runs the suite.
          #
          # TWO SEPARATE INVOCATIONS, in this order, matching containers/tiled/Dockerfile
          # exactly. requirements/torch-cpu.txt carries `--index-url .../whl/cpu`, which
          # applies to the WHOLE resolve if the file is pulled in by `-r` from another
          # requirements file -- so it must stay its own step. And kornia drags the ~2.5 GB
          # CUDA wheel from PyPI if torch is not already satisfied, so torch goes first.
          pip install -r requirements/torch-cpu.txt
          pip install -r requirements/kornia.txt

      - name: Generate test data
        run: |
          python tests/testdata/generate_complete_testdata.py

      # A skip is not a pass. tests/test_coarse_frontend.py's DISK+LightGlue cases
      # guard themselves with importorskip("torch")/importorskip("kornia"), so a
      # missing, broken or CUDA-only install turns them into silent skips -- which is
      # how an unimplemented front-end shipped once already. This step proves both
      # libraries import in the SAME interpreter pytest runs in, and then proves the
      # file reports ZERO skips. tests/test_disk_test_actually_runs.py asserts this
      # step exists in every workflow that runs the pytest suite.
      - name: Assert the DISK front-end test is not skipped
        run: |
          set -euo pipefail
          python -c "import torch, kornia; print(torch.__version__, kornia.__version__)"
          pytest tests/test_coarse_frontend.py -rs -q | tee coarse_frontend.log
          if grep -qi 'skipped' coarse_frontend.log; then
            echo "::error::tests/test_coarse_frontend.py reported a SKIP -- the DISK+LightGlue case did not run"
            exit 1
          fi

      # MIRAGE_STRICT_SKIPS turns on tests/conftest.py's session floor: any skip
      # not in tests/expected_skips.txt fails the job by name, and the collected
      # count must clear tests/collected_floor.txt. Without it a degraded
      # environment deselects most of the suite and still exits 0 -- release.yml
      # shipped for months missing three packages, and of the 43 tests that
      # stopped passing, 30 were silent.
      #
      # STEP level, not job level, ON PURPOSE. The "Assert the DISK front-end
      # test is not skipped" step above runs pytest over a single file, which
      # collects far below the floor; a job-level env would fail it.
      - name: Run Python unit tests
        env:
          MIRAGE_STRICT_SKIPS: '1'
        run: |
          pytest -v tests/ --ignore=tests/testdata --ignore=tests/modules --ignore=tests/subworkflows --ignore=tests/integration \
            --cov=bin --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================================
  # Nextflow stub tests + validation (fast, every push/PR)
  # ============================================================================
  nextflow-stub:
    name: NF ${{ matrix.nextflow-version }} stub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        nextflow-version: ['25.04.0', 'latest-everything']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Nextflow
        uses: actions/cache@v4
        with:
          path: |
            ~/.nextflow
            ~/.nf-test
          key: ${{ runner.os }}-nextflow-${{ matrix.nextflow-version }}-${{ hashFiles('**/*.nf') }}
          restore-keys: |
            ${{ runner.os }}-nextflow-${{ matrix.nextflow-version }}-
            ${{ runner.os }}-nextflow-

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nextflow-version }}

      - name: Cache Nextflow plugins
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nextflow-plugins
          key: ${{ runner.os }}-nf-plugins-${{ hashFiles('nextflow.config') }}
          restore-keys: |
            ${{ runner.os }}-nf-plugins-

      - name: Provision Nextflow plugins
        # Install the pinned nf-schema explicitly so a registry outage fails in
        # a step that names it, instead of halfway into a pipeline run. The
        # version is read out of nextflow.config rather than duplicated here, so
        # CI and the pipeline cannot pin different versions. No-op when the
        # cache above already restored it.
        run: |
          nextflow plugin install "$(sed -n "s/.*id '\(nf-schema@[0-9.]*\)'.*/\1/p" nextflow.config)"

      - name: Install Python for test data generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements/**'

      - name: Generate test data
        run: |
          # numpy and tifffile at the harmonised versions, taken from
          # requirements/constraints.txt -- the same file every container image reads. No
          # version is named here; there is nothing to keep in step by hand.
          pip install -r requirements/testdata.txt
          python tests/testdata/generate_complete_testdata.py

      - name: Check all profiles parse without the gitignored site config
        # Guards against the strict-parser regression class: a committed profile
        # must never includeConfig a gitignored/missing file (breaks every
        # profile in CI). Runs with conf/ieo.config absent (it already is in CI).
        run: |
          bash tests/check_profiles_parse.sh

      - name: Check param surface consistency (config <-> schema <-> code)
        # Fails if a param is declared/used but undocumented in nextflow_schema.json
        # (or vice-versa) — keeps the parameter surface from drifting.
        run: |
          python3 tests/check_param_consistency.py

      - name: Run pipeline validation tests
        run: |
          bash tests/run_validation_tests.sh

      - name: lib/ probe — assert lib/*.groovy behaviour
        # The unit-test surface for lib/*.groovy. Assertions live inside the
        # script because nf-test's assertion context cannot see lib/ classes.
        # A failing assert exits nonzero and fails this blocking job.
        run: |
          nextflow run tests/lib_probe.nf -lib lib

      - name: Run pipeline with test profile (stub mode)
        # Stub blocks only `touch` outputs — no container engine needed. Running
        # container-free keeps stub CI green without pulling per-process images
        # (real container behaviour is exercised by the nf-test real suite).
        run: |
          nextflow run . \
            -profile test \
            -stub \
            --outdir test_results_stub

      - name: Run pipeline with SHIPPED defaults (stub mode)
        # `-profile test` pins BOTH pixel_size (-> 0.325) and seg_method
        # (-> 'stardist') away from what actually ships ('auto' / 'instantseg'),
        # each for its own documented reason (conf/test.config) -- which means
        # the exact combination that ships was never executed by CI, stub or
        # real. `shipped_defaults_test` overrides both back and repoints `input`
        # at the one fixture pair this repo generates with a real OME
        # PhysicalSizeX/Y (tests/testdata/shipped_defaults_input.csv), because
        # every other fixture is scale-less on purpose and `auto` would
        # (correctly) hard-fail at PREFLIGHT_SCALE against it.
        run: |
          nextflow run . \
            -profile shipped_defaults_test \
            -stub \
            --outdir test_results_shipped_defaults

      - name: Verify work-directory cleanup and final-outputs-only publishing
        # A shell script, not a pytest and not an nf-test, and it needs its own
        # step or it runs nowhere -- the same gap the security-tests job exists to
        # close for the DEEPCELL guard.
        #
        # It cannot be either of those: `cleanup` is a Nextflow session-teardown
        # behaviour, invisible to a static guard over the sources and gone by the
        # time nf-test's assertion context runs. The script's fourth case is the
        # load-bearing one -- cleanup must never fire on a FAILED run, or a real
        # failure becomes undiagnosable.
        run: |
          bash tests/cleanup_work.sh

      - name: Upload stub test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stub-results-nf-${{ matrix.nextflow-version }}
          path: |
            test_results_stub/
            test_results_shipped_defaults/
            .nextflow.log

  # ============================================================================
  # nf-test stub suite (fast, every push/PR)
  # ============================================================================
  nf-test-stub:
    name: nf-test (stub)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Nextflow
        uses: actions/cache@v4
        with:
          path: ~/.nextflow
          key: ${{ runner.os }}-nextflow-${{ hashFiles('**/*.nf') }}
          restore-keys: |
            ${{ runner.os }}-nextflow-

      - name: Install Nextflow
        # Pinned to the supported release: nf-test 0.9.0's generated test
        # wrappers do not compile under edge Nextflow's strict parser.
        # latest-everything full-pipeline compatibility is covered by the
        # nextflow-stub job's matrix.
        uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.0'

      - name: Cache Nextflow plugins
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nextflow-plugins
          key: ${{ runner.os }}-nf-plugins-${{ hashFiles('nextflow.config') }}
          restore-keys: |
            ${{ runner.os }}-nf-plugins-

      - name: Provision Nextflow plugins
        # Install the pinned nf-schema explicitly so a registry outage fails in
        # a step that names it, instead of halfway into a pipeline run. The
        # version is read out of nextflow.config rather than duplicated here, so
        # CI and the pipeline cannot pin different versions. No-op when the
        # cache above already restored it.
        run: |
          nextflow plugin install "$(sed -n "s/.*id '\(nf-schema@[0-9.]*\)'.*/\1/p" nextflow.config)"

      - name: Install Python for test data generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements/**'

      - name: Generate test data
        run: |
          # numpy and tifffile at the harmonised versions, taken from
          # requirements/constraints.txt -- the same file every container image reads. No
          # version is named here; there is nothing to keep in step by hand.
          pip install -r requirements/testdata.txt
          python tests/testdata/generate_complete_testdata.py

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          version: ${{ env.NFTEST_VERSION }}

      - name: Run nf-test stub suite
        # Container-free (-profile test) and stub-only (--tag stub): stub blocks
        # need no images. Real cases are tagged "real" and run in the nf-test
        # real job once GHCR images are published (avoids pulling images that do
        # not exist yet on a PR).
        run: |
          nf-test test --tag stub --profile test --verbose

      - name: Upload nf-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nf-test-stub-results
          path: |
            .nf-test/
            tests/output/

  # ============================================================================
  # nf-test real suite (runs on push to main/dev only)
  # ============================================================================
  nf-test-real:
    name: nf-test (real)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    # ADVISORY, and advisory by ONE mechanism only: this job is absent from the
    # `all-tests` gate's `needs:` list. Registration, segmentation model-loading,
    # and most test-staging bugs are fixed (suite went 26 -> ~20 failing); the
    # remaining failures are the synthetic-data segmentation wall: StarDist's
    # built-in 2D_versatile_fluo detects 0 nuclei in the smooth synthetic test
    # blobs even at a low prob_thresh, so cell/quant/geojson assertions can't
    # pass on this fixture data. Tracked for a follow-up (bundle a tiny real
    # nuclei crop, or switch those assertions to "runs without error"). Add this
    # job to `all-tests`'s `needs:` once green.
    #
    # `continue-on-error: true` used to sit here as a SECOND advisory mechanism,
    # and it was the dishonest one: it made 129 real cases show a green tick
    # whatever they did, so the run summary said nothing about whether the suite
    # got better or worse. Without it the job reports its true colour and stays
    # non-blocking, because nothing needs it. Nothing stopped it coming back until
    # tests/test_release_workflow_graph.py grew a scan for it across every workflow.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Nextflow
        uses: actions/cache@v4
        with:
          path: ~/.nextflow
          key: ${{ runner.os }}-nextflow-real-${{ hashFiles('**/*.nf') }}
          restore-keys: |
            ${{ runner.os }}-nextflow-

      - name: Install Nextflow
        # Pinned to the supported release: nf-test 0.9.0's generated test
        # wrappers do not compile under edge Nextflow's strict parser.
        # latest-everything full-pipeline compatibility is covered by the
        # nextflow-stub job's matrix.
        uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.0'

      - name: Cache Nextflow plugins
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nextflow-plugins
          key: ${{ runner.os }}-nf-plugins-${{ hashFiles('nextflow.config') }}
          restore-keys: |
            ${{ runner.os }}-nf-plugins-

      - name: Provision Nextflow plugins
        # Install the pinned nf-schema explicitly so a registry outage fails in
        # a step that names it, instead of halfway into a pipeline run. The
        # version is read out of nextflow.config rather than duplicated here, so
        # CI and the pipeline cannot pin different versions. No-op when the
        # cache above already restored it.
        run: |
          nextflow plugin install "$(sed -n "s/.*id '\(nf-schema@[0-9.]*\)'.*/\1/p" nextflow.config)"

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install Python for test data generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements/**'

      - name: Generate test data
        run: |
          # numpy and tifffile at the harmonised versions, taken from
          # requirements/constraints.txt -- the same file every container image reads. No
          # version is named here; there is nothing to keep in step by hand.
          pip install -r requirements/testdata.txt
          python tests/testdata/generate_complete_testdata.py

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          version: ${{ env.NFTEST_VERSION }}

      - name: Run nf-test real suite
        run: |
          nf-test test --profile test,docker --tag real --verbose

      - name: Upload nf-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nf-test-real-results
          path: |
            .nf-test/
            tests/output/

  # ============================================================================
  # nf-test integration suite (manual trigger only)
  # ============================================================================
  nf-test-integration:
    name: nf-test (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        # Pinned to the supported release: nf-test 0.9.0's generated test
        # wrappers do not compile under edge Nextflow's strict parser.
        # latest-everything full-pipeline compatibility is covered by the
        # nextflow-stub job's matrix.
        uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.0'

      - name: Cache Nextflow plugins
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nextflow-plugins
          key: ${{ runner.os }}-nf-plugins-${{ hashFiles('nextflow.config') }}
          restore-keys: |
            ${{ runner.os }}-nf-plugins-

      - name: Provision Nextflow plugins
        # Install the pinned nf-schema explicitly so a registry outage fails in
        # a step that names it, instead of halfway into a pipeline run. The
        # version is read out of nextflow.config rather than duplicated here, so
        # CI and the pipeline cannot pin different versions. No-op when the
        # cache above already restored it.
        run: |
          nextflow plugin install "$(sed -n "s/.*id '\(nf-schema@[0-9.]*\)'.*/\1/p" nextflow.config)"

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install Python for test data generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements/**'

      - name: Generate test data
        run: |
          # numpy and tifffile at the harmonised versions, taken from
          # requirements/constraints.txt -- the same file every container image reads. No
          # version is named here; there is nothing to keep in step by hand.
          pip install -r requirements/testdata.txt
          python tests/testdata/generate_complete_testdata.py

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          version: ${{ env.NFTEST_VERSION }}

      - name: Run nf-test integration suite
        run: |
          nf-test test --profile test,docker --tag integration --verbose

      - name: Upload nf-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nf-test-integration-results
          path: |
            .nf-test/
            tests/output/

  # ============================================================================
  # Security tests (blocking)
  # ============================================================================
  # tests/modules/segment_deepcell_token.nf.test is deliberately NOT tagged
  # "stub" — it needs `-profile test,singularity` and Nextflow rejects a
  # duplicate `-profile` flag, so the nf-test-stub job's
  # `--tag stub --profile test` sweep can never collect it. That was correct and
  # documented; what was missing is that NOTHING ELSE collected it either.
  # Verified 2026-08-25: `nf-test test --tag stub --profile test --dry-run`
  # matched 0 deepcell tests. The guard existed and ran nowhere.
  #
  # It needs no Singularity binary. segment_deepcell_token_singularity.config
  # points SEGMENT's container at a local placeholder .sif (tracked in git, not
  # generated), which skips the `singularity pull`, and the test only inspects
  # the `.command.run` Nextflow writes before exec. Confirmed locally on a host
  # with neither `singularity` nor `apptainer` on PATH.
  security-tests:
    name: Security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        # Same pin as nf-test-stub: nf-test's generated wrappers do not compile
        # under edge Nextflow's strict parser.
        uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.0'

      - name: Cache Nextflow plugins
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nextflow-plugins
          key: ${{ runner.os }}-nf-plugins-${{ hashFiles('nextflow.config') }}
          restore-keys: |
            ${{ runner.os }}-nf-plugins-

      - name: Provision Nextflow plugins
        run: |
          nextflow plugin install "$(sed -n "s/.*id '\(nf-schema@[0-9.]*\)'.*/\1/p" nextflow.config)"

      - name: Install Python for test data generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements/**'

      - name: Generate test data
        run: |
          # numpy and tifffile at the harmonised versions, taken from
          # requirements/constraints.txt -- the same file every container image reads. No
          # version is named here; there is nothing to keep in step by hand.
          pip install -r requirements/testdata.txt
          python tests/testdata/generate_complete_testdata.py

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          version: ${{ env.NFTEST_VERSION }}

      - name: Token-leak guard
        # Asserts DEEPCELL_ACCESS_TOKEN is forwarded BY NAME and its VALUE never
        # reaches .command.run, which is group-readable on a typical shared HPC
        # filesystem and is retained across -resume. The variable must be set in
        # the environment invoking nf-test: the test asserts on its presence
        # first, because without it SEGMENT never reaches the guarded branch and
        # the whole case would pass while checking nothing.
        env:
          DEEPCELL_ACCESS_TOKEN: dummy-token-value
        run: |
          nf-test test tests/modules/segment_deepcell_token.nf.test \
            --profile test,singularity --verbose

      - name: Assert the guard actually executed
        # A tag typo, a renamed file, or a --profile change would make nf-test
        # exit 0 having run nothing — which is the exact failure this job was
        # added to close, so it must not be able to recur here.
        env:
          DEEPCELL_ACCESS_TOKEN: dummy-token-value
        run: |
          n=$(nf-test test tests/modules/segment_deepcell_token.nf.test \
                --profile test,singularity --dry-run 2>&1 \
              | grep -ci "DEEPCELL_ACCESS_TOKEN" || true)
          echo "collected $n case(s)"
          test "$n" -ge 1

  # ============================================================================
  # Python lint (blocking) — ruff check only, not ruff format. The repo is not
  # format-normalized yet, so format enforcement is deliberately out of scope;
  # this job only fails the build on actual lint errors (pyflakes/pycodestyle/
  # import-sort per ruff.toml).
  # ============================================================================
  ruff:
    name: Ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements/**'

      - name: Install ruff
        # Pinned to the version used locally (see ruff.toml) so CI and local
        # `ruff check .` agree exactly.
        run: |
          pip install -r requirements/lint.txt

      - name: Run ruff check
        run: |
          ruff check .

  # ============================================================================
  # Linting (nf-core structure lint — advisory, not a merge gate)
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        # Pin to the supported release for deterministic lint (matches the rest
        # of the suite); avoids edge-Nextflow surprises in advisory linting.
        uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.0'

      - name: Install nf-core tools
        run: |
          pip install -r requirements/nf-core.txt

      - name: Run nf-core lint
        run: |
          nf-core lint --dir . || true  # nf-core lint is advisory, not blocking

  # ============================================================================
  # All tests passed gate
  # ============================================================================
  all-tests:
    name: All Tests
    # `lint` (nf-core structure lint) is deliberately NOT in this list: it
    # always exits 0 (`|| true`, kept advisory on purpose — see the lint job
    # above), so including it here would be a fake gate that can never fail.
    # `ruff` is the real, blocking Python lint gate.
    needs: [python-tests, nextflow-stub, nf-test-stub, security-tests, ruff]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check all jobs passed
        # `skipped` is NOT a pass. Every branch here used to read
        # `!= "success" && != "skipped"`, which was harmless only because
        # nothing in the needs list can skip today -- the moment anyone adds a
        # `paths:` or `if:` filter to one of those five jobs, this gate goes
        # decorative for it and reports green having verified nothing. A needed
        # job that stops running must block the merge, not be waved through.
        # Guarded by tests/test_release_workflow_graph.py, which scans EVERY
        # workflow -- it read release.yml's copy of this gate only, so this one
        # could be (and was) reverted with the whole suite still green.
        run: |
          if [ "${{ needs.python-tests.result }}" != "success" ]; then
            echo "Python tests did not pass (result: ${{ needs.python-tests.result }})"
            exit 1
          fi
          if [ "${{ needs.nextflow-stub.result }}" != "success" ]; then
            echo "Nextflow stub tests did not pass (result: ${{ needs.nextflow-stub.result }})"
            exit 1
          fi
          if [ "${{ needs.nf-test-stub.result }}" != "success" ]; then
            echo "nf-test stub did not pass (result: ${{ needs.nf-test-stub.result }})"
            exit 1
          fi
          if [ "${{ needs.security-tests.result }}" != "success" ]; then
            echo "Security tests did not pass (result: ${{ needs.security-tests.result }})"
            exit 1
          fi
          if [ "${{ needs.ruff.result }}" != "success" ]; then
            echo "Ruff lint did not pass (result: ${{ needs.ruff.result }})"
            exit 1
          fi
          echo "All required tests passed!"
