  # `ref: ${{ github.sha }}` IS LOAD-BEARING, not decoration. A called workflow
  # does its own checkout and sees the CALLER's `github.ref`, not whatever the
  # caller checked out -- the property build-images.yml's `workflow_call` block
  # documents at length after it built ten container images from the wrong tree.
  # Passing the SHA pins this run to one commit: on a pull_request `github.sha`
  # is the merge commit the run is about, and on a push it is the pushed commit.
  # release.yml passes the SHA `validate` pinned, for the same reason.
  #
  # `secrets:` names ONE secret rather than `inherit`. The suite needs the
  # Codecov token and nothing else; `inherit` would hand a test suite every
  # secret its caller holds, which for release.yml is the Docker Hub push
  # credentials.
  test-suite:
    name: Test suite
    uses: ./.github/workflows/_test-suite.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
