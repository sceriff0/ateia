name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

# Least-privilege default token: read-only. Individual jobs escalate explicitly
# (e.g. distributed-integration sets packages read via GHCR login with the
# built-in token). Hardens against a compromised action writing to the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes; a new push to a PR
# branch kills the previous in-flight run instead of stacking them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NFTEST_VERSION: '0.9.0'
  NF_VALIDATION_VERSION: '1.1.3'

jobs:
  # ============================================================================
  # Python unit tests
  # ============================================================================
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt || true
          fi
          pip install pytest pytest-cov tifffile numpy pandas scikit-image scipy scikit-learn xmltodict

      - name: Generate test data
        run: |
          python tests/testdata/generate_complete_testdata.py

      - name: Run Python unit tests
        run: |
          pytest -v tests/ --ignore=tests/testdata --ignore=tests/modules --ignore=tests/subworkflows --ignore=tests/integration \
            --cov=bin --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================================
  # Nextflow stub tests + validation (fast, every push/PR)
  # ============================================================================
  nextflow-stub:
    name: NF ${{ matrix.nextflow-version }} stub
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextflow-version: ['25.04.0', 'latest-everything']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Nextflow
        uses: actions/cache@v4
        with:
          path: |
            ~/.nextflow
            ~/.nf-test
          key: ${{ runner.os }}-nextflow-${{ matrix.nextflow-version }}-${{ hashFiles('**/*.nf') }}
          restore-keys: |
            ${{ runner.os }}-nextflow-${{ matrix.nextflow-version }}-
            ${{ runner.os }}-nextflow-

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nextflow-version }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install Python for test data generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Generate test data
        run: |
          pip install numpy tifffile
          python tests/testdata/generate_complete_testdata.py

      - name: Check all profiles parse without the gitignored site config
        # Guards against the strict-parser regression class: a committed profile
        # must never includeConfig a gitignored/missing file (breaks every
        # profile in CI). Runs with conf/ieo.config absent (it already is in CI).
        run: |
          bash tests/check_profiles_parse.sh

      - name: Check param surface consistency (config <-> schema <-> code)
        # Fails if a param is declared/used but undocumented in nextflow_schema.json
        # (or vice-versa) — keeps the parameter surface from drifting.
        run: |
          python3 tests/check_param_consistency.py

      - name: Run pipeline validation tests
        run: |
          bash tests/run_validation_tests.sh

      - name: Run pipeline with test profile (stub mode)
        # Stub blocks only `touch` outputs — no container engine needed. Running
        # container-free keeps stub CI green without pulling per-process images
        # (real container behaviour is exercised by the nf-test real suite).
        run: |
          nextflow run . \
            -profile test \
            -stub \
            --outdir test_results_stub

      - name: Upload stub test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stub-results-nf-${{ matrix.nextflow-version }}
          path: |
            test_results_stub/
            .nextflow.log

  # ============================================================================
  # nf-test stub suite (fast, every push/PR)
  # ============================================================================
  nf-test-stub:
    name: nf-test (stub)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Nextflow
        uses: actions/cache@v4
        with:
          path: ~/.nextflow
          key: ${{ runner.os }}-nextflow-${{ hashFiles('**/*.nf') }}
          restore-keys: |
            ${{ runner.os }}-nextflow-

      - name: Install Nextflow
        # Pinned to the supported release: nf-test 0.9.0's generated test
        # wrappers do not compile under edge Nextflow's strict parser.
        # latest-everything full-pipeline compatibility is covered by the
        # nextflow-stub job's matrix.
        uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.0'

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install Python for test data generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Generate test data
        run: |
          pip install numpy tifffile
          python tests/testdata/generate_complete_testdata.py

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          version: ${{ env.NFTEST_VERSION }}

      - name: Run nf-test stub suite
        # Container-free (-profile test) and stub-only (--tag stub): stub blocks
        # need no images. Real cases are tagged "real" and run in the nf-test
        # real job once GHCR images are published (avoids pulling images that do
        # not exist yet on a PR).
        run: |
          nf-test test --tag stub --profile test --verbose

      - name: Upload nf-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nf-test-stub-results
          path: |
            .nf-test/
            tests/output/

  # ============================================================================
  # nf-test real suite (runs on push to main/dev only)
  # ============================================================================
  nf-test-real:
    name: nf-test (real)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    # ADVISORY. Registration, segmentation model-loading, and most test-staging
    # bugs are fixed (suite went 26 -> ~20 failing); the remaining failures are
    # the synthetic-data segmentation wall: StarDist's built-in 2D_versatile_fluo
    # detects 0 nuclei in the smooth synthetic test blobs even at a low
    # prob_thresh, so cell/quant/geojson assertions can't pass on this fixture
    # data. Tracked for a follow-up (bundle a tiny real nuclei crop, or switch
    # those assertions to "runs without error"). Flip to blocking once green.
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Nextflow
        uses: actions/cache@v4
        with:
          path: ~/.nextflow
          key: ${{ runner.os }}-nextflow-real-${{ hashFiles('**/*.nf') }}
          restore-keys: |
            ${{ runner.os }}-nextflow-

      - name: Install Nextflow
        # Pinned to the supported release: nf-test 0.9.0's generated test
        # wrappers do not compile under edge Nextflow's strict parser.
        # latest-everything full-pipeline compatibility is covered by the
        # nextflow-stub job's matrix.
        uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.0'

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install Python for test data generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Generate test data
        run: |
          pip install numpy tifffile
          python tests/testdata/generate_complete_testdata.py

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          version: ${{ env.NFTEST_VERSION }}

      - name: Run nf-test real suite
        run: |
          nf-test test --profile test,docker --tag real --verbose

      - name: Upload nf-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nf-test-real-results
          path: |
            .nf-test/
            tests/output/

  # ============================================================================
  # nf-test integration suite (manual trigger only)
  # ============================================================================
  nf-test-integration:
    name: nf-test (integration)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        # Pinned to the supported release: nf-test 0.9.0's generated test
        # wrappers do not compile under edge Nextflow's strict parser.
        # latest-everything full-pipeline compatibility is covered by the
        # nextflow-stub job's matrix.
        uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.0'

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install Python for test data generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Generate test data
        run: |
          pip install numpy tifffile
          python tests/testdata/generate_complete_testdata.py

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          version: ${{ env.NFTEST_VERSION }}

      - name: Run nf-test integration suite
        run: |
          nf-test test --profile test,docker --tag integration --verbose

      - name: Upload nf-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nf-test-integration-results
          path: |
            .nf-test/
            tests/output/

  # ============================================================================
  # In-image unit tests (spec §8). These need the VALIS image for pyvips/valis but
  # NOT a registration run, so they are cheap enough to gate EVERY push — unlike
  # the bit-identity harnesses below, which run a real reg_prep.
  #
  # They exist because the low-memory path's correctness argument is "the reader
  # and the tile grid reproduce VALIS exactly". Before this job, nothing checked
  # that automatically: every guarantee depended on someone remembering to run
  # Docker by hand. This is the job that makes them non-optional.
  # ============================================================================
  valis-unit:
    name: In-image unit tests (reader, grid, compare)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The committed fixtures are rewritten by the generator (see tests/testdata):
      # without this the tests read stale/absent inputs.
      - name: Generate test data
        run: |
          pip install numpy tifffile
          python tests/testdata/generate_complete_testdata.py

      - name: Run the in-image unit suites
        run: |
          IMG="bolt3x/attend_image_analysis:mirage_valis_1.0.0"
          docker pull "$IMG"
          # Each file is its own step-within-a-step so the log names the failing suite.
          # pytest is NOT installed in this image — every one of these carries a stdlib
          # __main__ runner and exits non-zero on failure. Do not switch to `pytest`.
          for t in tests/unit/test_tile_grid.py \
                   tests/unit/test_mirage_slide_reader.py \
                   tests/unit/test_compare_registration.py; do
            echo "::group::$t"
            docker run --rm -v "$PWD":/work -w /work "$IMG" python3 "$t"
            echo "::endgroup::"
          done

  # ============================================================================
  # Distributed registration bit-identical check (needs the published patched
  # image). Runs the real integration harnesses in the patched VALIS image:
  # distributed (PREP -> REG_TILE -> FINALIZE) == in-process tiler, max|Δ|=0.
  # See .github/workflows/build-valis-image.yml to publish the image.
  #
  # Trigger matches nf-test-real: push to main/dev, plus manual dispatch. These
  # run a real reg_prep, so they are too slow to gate every PR — but leaving them
  # dispatch-only meant nothing on this branch was ever verified automatically.
  # ============================================================================
  distributed-integration:
    name: distributed bit-identical (real image)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    # Pulls the patched VALIS image from Docker Hub (public — no auth needed).
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate test data
        run: |
          pip install numpy tifffile
          python tests/testdata/generate_complete_testdata.py

      - name: Pull the patched VALIS image
        run: docker pull bolt3x/attend_image_analysis:mirage_valis_1.0.0

      - name: Run distributed bit-identical verification in the patched image
        run: |
          IMG="bolt3x/attend_image_analysis:mirage_valis_1.0.0"
          docker run --rm -v "$PWD":/work -w /work "$IMG" \
            python3 tests/integration/verify_distributed_bitidentical.py

      # Spec assumption A1: pyvips and BioFormats decode mirage's OME-TIFF to the
      # same pixels. The whole reader swap rests on this; it asserts the reader
      # class too, so it cannot pass vacuously.
      - name: Probe reader equivalence (spec A1)
        run: |
          IMG="bolt3x/attend_image_analysis:mirage_valis_1.0.0"
          docker run --rm -v "$PWD":/work -w /work "$IMG" \
            python3 tests/integration/probe_reader_equivalence.py

      # Legs 1 and 2: full-res warp through the lazy reader == BioFormats, and the
      # output-tile fan-out == the single-process warp.
      - name: Verify low-memory path is bit-identical
        run: |
          IMG="bolt3x/attend_image_analysis:mirage_valis_1.0.0"
          docker run --rm -v "$PWD":/work -w /work "$IMG" \
            python3 tests/integration/verify_lowmem_bitidentical.py

      # Micro-registration is degenerate at 128px, hence the 1024px fixture. This
      # harness existed in the repo but was referenced by no workflow.
      - name: Verify micro-registration is bit-identical
        run: |
          IMG="bolt3x/attend_image_analysis:mirage_valis_1.0.0"
          docker run --rm -v "$PWD":/work -w /work "$IMG" bash -lc '
            python3 tests/testdata/generate_large_fixture.py --size 1024 --out /tmp/bigdata &&
            python3 tests/integration/verify_micro_bitidentical.py'

  # ============================================================================
  # Linting
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        # Pin to the supported release for deterministic lint (matches the rest
        # of the suite); avoids edge-Nextflow surprises in advisory linting.
        uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.0'

      - name: Install nf-core tools
        run: |
          pip install 'nf-core<3.5'

      - name: Run nf-core lint
        run: |
          nf-core lint --dir . || true  # nf-core lint is advisory, not blocking

  # ============================================================================
  # All tests passed gate
  # ============================================================================
  all-tests:
    name: All Tests
    needs: [python-tests, nextflow-stub, nf-test-stub, valis-unit, lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.python-tests.result }}" != "success" ] && [ "${{ needs.python-tests.result }}" != "skipped" ]; then
            echo "Python tests failed"
            exit 1
          fi
          if [ "${{ needs.nextflow-stub.result }}" != "success" ] && [ "${{ needs.nextflow-stub.result }}" != "skipped" ]; then
            echo "Nextflow stub tests failed"
            exit 1
          fi
          if [ "${{ needs.nf-test-stub.result }}" != "success" ] && [ "${{ needs.nf-test-stub.result }}" != "skipped" ]; then
            echo "nf-test stub failed"
            exit 1
          fi
          if [ "${{ needs.valis-unit.result }}" != "success" ] && [ "${{ needs.valis-unit.result }}" != "skipped" ]; then
            echo "In-image unit tests failed (reader / tile grid / compare)"
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ] && [ "${{ needs.lint.result }}" != "skipped" ]; then
            echo "Lint check had issues (advisory, not blocking)"
          fi
          echo "All required tests passed!"
