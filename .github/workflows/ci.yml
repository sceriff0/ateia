# =============================================================================
# CI (the blocking gate)
# =============================================================================
# EVERY JOB IN THIS FILE IS IN THE `all-tests` GATE, except `lint`, which runs
# `nf-core lint ... || true` and says so. That is a deliberate property as of
# 2026-09-01 (CI redesign, Phase 4): a run's conclusion is the WORST conclusion
# of any job in it, gate membership or not, so a non-required job that fails
# still paints the commit, the badge and the PR checks list red. This workflow
# used to carry two such jobs -- `nf-test-real` and `nf-test-integration` -- and
# on every push to main or dev it reported `failure` while the gate itself was
# green. Training people to ignore red is the failure mode the redesign exists to
# remove, so both moved to `.github/workflows/nightly.yml`, which carries the
# record of WHY the real suite is red rather than letting the next person
# re-derive it.
#
# So: a green run of this workflow now means a green gate. Keep it that way --
# an advisory job belongs in nightly.yml, not here with a missing `needs:` entry,
# and never behind `continue-on-error`. tests/test_release_workflow_graph.py
# asserts both halves.
#
# -----------------------------------------------------------------------------
# THE TEST SUITE LIVES IN `_test-suite.yml`, AND SO DOES THE RELEASE GATE'S
# -----------------------------------------------------------------------------
# As of 2026-09-01 (Phase 5) the five blocking suites -- python-tests,
# nextflow-stub, nf-test-stub, security-tests, ruff -- are NOT written here. They
# are one reusable workflow, `.github/workflows/_test-suite.yml`, which this file
# and `release.yml` both call.
#
# That is the fix for a specific defect, not a tidy-up. release.yml used to hold
# a hand-maintained copy of these five jobs, and the copy had diverged: the
# release gate ran 5 of the 13 checks this file blocks on while its header
# claimed parity. The copy was repaired in 2026-08-31 and then kept honest by a
# 693-line guard test that compared command strings across the two files. There
# is now one file, so the comparison has nothing to compare and the guard is
# smaller: what it asserts instead is that both gates reach the same reusable
# workflow, which is a fact about `needs:` and `uses:` rather than about prose.
#
# `_test-suite.yml`'s header records what the check names become and which two
# names to require if branch protection is ever turned on (there is none today --
# measured, see that header).
# =============================================================================
name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

# Least-privilege default token: read-only. Hardens against a compromised
# action writing to the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes; a new push to a PR
# branch kills the previous in-flight run instead of stacking them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `NFTEST_VERSION` is gone from this file: nothing left in it runs nf-test.
  #
  # `NXF_PLUGINS_DIR` stays, and the reason is narrower than it used to be. The
  # only Nextflow job still written here is `lint`, which sets Nextflow up with
  # `plugins: 'false'` and never provisions nf-schema -- so this is NOT here to
  # share a plugin download any more. It is here so that anything `nf-core lint`
  # invokes through Nextflow writes its plugins to a workspace directory instead
  # of `~/.nextflow/plugins`. `~/.nextflow` IS the path
  # `.github/actions/setup-nextflow` caches, keyed on the Nextflow version alone;
  # letting plugins land inside it would make that entry a function of something
  # the key does not name, which is caching rule 2 (see that action's header).
  # Same mechanism docs/usage.md documents for air-gapped clusters.
  #
  # `_test-suite.yml` declares its own copy of this rather than inheriting one:
  # `env:` does NOT cross a workflow_call boundary.
  NXF_PLUGINS_DIR: ${{ github.workspace }}/.nextflow-plugins

jobs:
  # ============================================================================
  # The blocking test suite (reusable workflow)
  # ============================================================================
  # Five jobs on five runners: python-tests (matrixed 3.10 + 3.11),
  # nextflow-stub (matrixed 25.04.0 + latest-everything), nf-test-stub,
  # security-tests, ruff. See `.github/workflows/_test-suite.yml`.
  #
