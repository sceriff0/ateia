# =============================================================================
# CI (the blocking gate)
# =============================================================================
# EVERY JOB IN THIS FILE IS IN THE `all-tests` GATE, except `lint`, which runs
# `nf-core lint ... || true` and says so. That is a deliberate property as of
# 2026-09-01 (CI redesign, Phase 4): a run's conclusion is the WORST conclusion
# of any job in it, gate membership or not, so a non-required job that fails
# still paints the commit, the badge and the PR checks list red. This workflow
# used to carry two such jobs -- `nf-test-real` and `nf-test-integration` -- and
# on every push to main or dev it reported `failure` while the gate itself was
# green. Training people to ignore red is the failure mode the redesign exists to
# remove, so both moved to `.github/workflows/nightly.yml`, which carries the
# record of WHY the real suite is red rather than letting the next person
# re-derive it.
#
# So: a green run of this workflow now means a green gate. Keep it that way --
# an advisory job belongs in nightly.yml, not here with a missing `needs:` entry,
# and never behind `continue-on-error`. tests/test_release_workflow_graph.py
# asserts both halves.
#
# -----------------------------------------------------------------------------
# THE TEST SUITE LIVES IN `_test-suite.yml`, AND SO DOES THE RELEASE GATE'S
# -----------------------------------------------------------------------------
# As of 2026-09-01 (Phase 5) the five blocking suites -- python-tests,
# nextflow-stub, nf-test-stub, security-tests, ruff -- are NOT written here. They
# are one reusable workflow, `.github/workflows/_test-suite.yml`, which this file
# and `release.yml` both call.
#
# That is the fix for a specific defect, not a tidy-up. release.yml used to hold
# a hand-maintained copy of these five jobs, and the copy had diverged: the
# release gate ran 5 of the 13 checks this file blocks on while its header
# claimed parity. The copy was repaired in 2026-08-31 and then kept honest by a
# 693-line guard test that compared command strings across the two files. There
# is now one file, so the comparison has nothing to compare and the guard is
# smaller: what it asserts instead is that both gates reach the same reusable
# workflow, which is a fact about `needs:` and `uses:` rather than about prose.
#
# `_test-suite.yml`'s header records what the check names become and which two
# names to require if branch protection is ever turned on (there is none today --
# measured, see that header).
# =============================================================================
name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

# Least-privilege default token: read-only. Hardens against a compromised
# action writing to the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes; a new push to a PR
# branch kills the previous in-flight run instead of stacking them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `NFTEST_VERSION` is gone from this file: nothing left in it runs nf-test.
  #
  # `NXF_PLUGINS_DIR` stays, and the reason is narrower than it used to be. The
  # only Nextflow job still written here is `lint`, which sets Nextflow up with
  # `plugins: 'false'` and never provisions nf-schema -- so this is NOT here to
  # share a plugin download any more. It is here so that anything `nf-core lint`
  # invokes through Nextflow writes its plugins to a workspace directory instead
  # of `~/.nextflow/plugins`. `~/.nextflow` IS the path
  # `.github/actions/setup-nextflow` caches, keyed on the Nextflow version alone;
  # letting plugins land inside it would make that entry a function of something
  # the key does not name, which is caching rule 2 (see that action's header).
  # Same mechanism docs/usage.md documents for air-gapped clusters.
  #
  # `_test-suite.yml` declares its own copy of this rather than inheriting one:
  # `env:` does NOT cross a workflow_call boundary.
  NXF_PLUGINS_DIR: ${{ github.workspace }}/.nextflow-plugins

jobs:
  # ============================================================================
  # The blocking test suite (reusable workflow)
  # ============================================================================
  # Five jobs on five runners: python-tests (matrixed 3.10 + 3.11),
  # nextflow-stub (matrixed 25.04.0 + latest-everything), nf-test-stub,
  # security-tests, ruff. See `.github/workflows/_test-suite.yml`.
  #
  # `ref: ${{ github.sha }}` IS LOAD-BEARING, not decoration. A called workflow
  # does its own checkout and sees the CALLER's `github.ref`, not whatever the
  # caller checked out -- the property containers.yml's `workflow_call` block
  # documents at length after it built ten container images from the wrong tree.
  # Passing the SHA pins this run to one commit: on a pull_request `github.sha`
  # is the merge commit the run is about, and on a push it is the pushed commit.
  # release.yml passes the SHA `validate` pinned, for the same reason.
  #
  # `secrets:` names ONE secret rather than `inherit`. The suite needs the
  # Codecov token and nothing else; `inherit` would hand a test suite every
  # secret its caller holds, which for release.yml is the Docker Hub push
  # credentials.
  test-suite:
    name: Test suite
    uses: ./.github/workflows/_test-suite.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================================
  # Container images — build only what this change touched, and prove it runs
  # ============================================================================
  # ADDED 2026-09-01 (CI redesign, Phase 6). Until then NOTHING built a container
  # image on a pull request: `build-images.yml` triggered on a push to main and on
  # a manual dispatch only. So a Dockerfile could stop building and the PR that
  # broke it was green; the failure surfaced on main, or on the release path, where
  # it costs a half-published image set. containers/regqc carried a
  # `pip install git+https://github.com/sceriff0/cudipy.git` for months after that
  # repository ceased to exist, and nothing in CI could have noticed.
  #
  # `scope: changed` is what makes this affordable: `containers.yml` diffs the
  # change against its base and builds only the images whose build context (or a
  # requirements file their Dockerfile actually COPYs) moved. A PR that touches no
  # image resolves to an empty matrix and its `build` job legitimately skips.
  #
  # IT IS IN THE `all-tests` GATE, and that is a deliberate departure from the
  # redesign spec, which said not to make the build a required check because an
  # empty matrix hard-fails and the gate would have to tolerate a skip. It does not
  # have to here: what the gate depends on is THIS job -- the caller -- which has no
  # `if:` and never skips. The skip happens one level down, on `containers.yml`'s
  # matrix job, and a called workflow's conclusion is `success` when a job inside it
  # skips. So `all-tests` keeps "anything that is not a success fails", and a
  # Dockerfile that stops building blocks the merge instead of being noticed later.
  # (`containers.yml`'s own `resolve` job never skips, which is what stops the
  # "every job skipped concludes success" hazard `_test-suite.yml`'s `suite-gate`
  # exists for.)
  containers:
    name: Container images
    uses: ./.github/workflows/containers.yml
    with:
      # Same reason as `test-suite` above: a called workflow does its own checkout
      # against the CALLER's github.ref, so the commit has to be handed over.
      ref: ${{ github.sha }}
      scope: changed
      # No `version:` -- an empty version is how a caller says "build, never push".
      # containers.yml's resolver reads that, not github.event_name.
    permissions:
      contents: read

  # ============================================================================
  # Linting (nf-core structure lint — advisory, not a merge gate)
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nextflow
        # Pinned to the supported release for deterministic lint (the action's
        # default, matching the rest of the suite); avoids edge-Nextflow
        # surprises in advisory linting.
        #
        # `plugins: 'false'` is the one deliberate departure from every other
        # caller: this job never runs the pipeline, so provisioning nf-schema
        # would add a plugin-registry network dependency to a job that has no use
        # for it. It is also the pre-existing behaviour -- this job never had the
        # plugin steps -- so nothing here changes what CI does.
        uses: ./.github/actions/setup-nextflow
        with:
          plugins: 'false'

      - name: Set up Python and install nf-core tools
        uses: ./.github/actions/setup-python-env
        with:
          requirements: 'requirements/nf-core.txt'

      - name: Run nf-core lint
        run: |
          nf-core lint --dir . || true  # nf-core lint is advisory, not blocking

  # ============================================================================
  # All tests passed gate
  # ============================================================================
  all-tests:
    name: All Tests
    # `lint` (nf-core structure lint) is deliberately NOT in this list: it
    # always exits 0 (`|| true`, kept advisory on purpose — see the lint job
    # above), so including it here would be a fake gate that can never fail.
    #
    # It is the ONLY job in this file outside the list. The five blocking suites
    # this list used to name one by one -- python-tests, nextflow-stub,
    # nf-test-stub, security-tests, ruff -- are now the five jobs of
    # `_test-suite.yml`, and `test-suite` below is the one job whose result
    # reports all of them. That is not a loosening: `_test-suite.yml`'s own
    # `suite-gate` job enumerates the five and fails on anything that is not a
    # success, because a called workflow whose jobs were all skipped concludes
    # `success` and this line alone would wave that through.
    #
    # nightly.yml holds the two advisory suites (`nf-test-real`,
    # `nf-test-integration`); when the real suite goes green it comes back into
    # the shared suite, not into this list directly.
    #
    # `containers` joined the list in Phase 6. It is the CALLER job, which has no
    # `if:` and therefore never skips, so requiring `success` from it does not
    # depend on whether there was anything to build -- see that job's header.
    needs: [test-suite, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check all jobs passed
        # `skipped` is NOT a pass. Every branch here used to read
        # `!= "success" && != "skipped"`, which was harmless only because
        # nothing in the needs list can skip today -- the moment anyone adds a
        # `paths:` or `if:` filter to a needed job, this gate goes decorative
        # for it and reports green having verified nothing. A needed job that
        # stops running must block the merge, not be waved through.
        # Guarded by tests/test_release_workflow_graph.py, which scans EVERY
        # workflow -- it read release.yml's copy of this gate only, so this one
        # could be (and was) reverted with the whole suite still green.
        run: |
          if [ "${{ needs.test-suite.result }}" != "success" ]; then
            echo "The shared test suite did not pass (result: ${{ needs.test-suite.result }})"
            exit 1
          fi
          if [ "${{ needs.containers.result }}" != "success" ]; then
            echo "The container build did not pass (result: ${{ needs.containers.result }})"
            exit 1
          fi
          echo "All required tests passed!"
