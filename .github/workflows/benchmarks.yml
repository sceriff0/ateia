name: stare-bench

on:
  push:
    branches: [benchmarking, 'bench/**']
  pull_request:
    branches: [benchmarking]

jobs:
  stare-bench:
    runs-on: ubuntu-latest
    # 15, down from 60. The 60 was sized for the stare_bench unit rung, which ran the
    # DISK+LightGlue COARSE front-end on CPU (23m33s locally). That rung is deleted; what
    # remains is the plan/analysis layer on tiny synthetic fixtures, ~5s locally. Left
    # well above the measured time so an under-provisioned runner does not flake, but low
    # enough that a hang fails in minutes instead of an hour.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        # scikit-learn + matplotlib are for the ANALYSIS layer:
        # benchmarks/analysis/lib/regress.py imports sklearn.linear_model and
        # test_plotting.py imports matplotlib. Without them pytest dies during
        # COLLECTION with exit 2 -- four ImportErrors, zero tests run -- which is
        # how this job failed on 2026-08-26 and 2026-08-27 while looking like an
        # ordinary red build. Kept in step with the imports by
        # tests/test_ci_installs_what_benchmarks_import.py.
        #
        # torch + kornia + zarr/numcodecs/imagecodecs are GONE with the stare_bench rung.
        # They were there because run_unit.py drove bin/tiled_*.py IN-PROCESS, outside any
        # container; nothing under benchmarks/ executes a pipeline entry point in CI any
        # more. benchmarks/run_ashlar_arm.sh does, but it runs on the cluster inside the
        # images that already carry those deps -- see the note in the test file.
        run: |
          # Pinned to the SAME versions ci.yml pins (tests/test_ci_stack_pinned.py
          # enforces the `==` form): an unpinned imaging stack lets this job resolve
          # different numerics than the production containers.
          pip install numpy==1.26.4 scipy==1.15.3 scikit-image==0.25.2 \
                      tifffile==2025.5.10 pandas pyyaml pytest ruff \
                      scikit-learn==1.5.2 matplotlib==3.8.4
      - name: Test
        run: python -m pytest benchmarks/tests -v
      # benchmarks/ is excluded in ruff.toml as "benchmarking scratch";
      # --no-force-exclude lints the explicitly-named paths anyway. The
      # deliberate-violation step in this task's plan verifies that it really does.
      - name: Lint
        # NOT `benchmarks/tests` wholesale: benchmarks/ is excluded in ruff.toml as
        # "benchmarking scratch", and the previously-linted set was stare_bench plus
        # make_tables.py. Widening to every test file surfaces 33 pre-existing violations
        # (E702/E731/I001) in files this lint never covered -- unrelated work, and
        # silently reformatting them would bury the change that widened the scope.
        # Listed explicitly so growing the set stays a decision.
        run: ruff check --no-force-exclude benchmarks/ashlar benchmarks/analysis/make_tables.py benchmarks/build_arm_plan.py benchmarks/tests/test_build_arm_plan.py benchmarks/tests/test_ci_installs_what_benchmarks_import.py
