# =============================================================================
# Build & Push Container Images
# =============================================================================
# Builds every Docker image vendored under containers/<name>/ and pushes it to
# Docker Hub as bolt3x/attend_image_analysis:<tag>.
#
# NOTE: This repo uses a SINGLE Docker Hub repository (bolt3x/attend_image_analysis)
# with one descriptive tag per image, matching how the modules pull them
# (e.g. bolt3x/attend_image_analysis:preprocess). Docker Hub has no sub-path
# namespace like GHCR, so the matrix maps each build context dir -> its tag.
#
# Triggers:
#   * release:published    -> build + push, using each image's descriptive tag
#   * workflow_dispatch     -> build + push
#   * push to main (when    -> build ONLY (no push) so PRs/merges validate the
#     containers/** change)     Dockerfiles without publishing
#   * workflow_call         -> reusable; release.yml calls this with a version
#
# Auth: docker/login-action -> Docker Hub using DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
#       repository secrets (Settings -> Secrets and variables -> Actions).
# Caching: GitHub Actions cache backend (type=gha) for fast layer reuse.
# =============================================================================
name: Build Images

on:
  # Published GitHub release -> build & push, version taken from the tag.
  release:
    types: [published]

  # Manual trigger -> build & push, version supplied by the operator.
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag/version to publish (e.g. v1.0.0)'
        required: true
        type: string

  # Changes to any vendored container -> build only (no push) as a sanity check.
  push:
    branches: [main]
    paths:
      - 'containers/**'
      - '.github/workflows/build-images.yml'

  # Reusable entry point so release.yml can invoke this workflow.
  workflow_call:
    inputs:
      version:
        description: 'Image tag/version to publish (e.g. v1.0.0)'
        required: true
        type: string

# Docker Hub push needs no special GITHUB_TOKEN scope; contents:read for checkout.
permissions:
  contents: read

# Serialize per ref; do NOT cancel — an interrupted run can leave a half-pushed
# image set on Docker Hub.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

env:
  # Single Docker Hub repository that holds every image (as descriptive tags).
  IMAGE_REPO: docker.io/bolt3x/attend_image_analysis

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the version/tag and whether we should push.
  # ---------------------------------------------------------------------------
  setup:
    name: Resolve build parameters
    runs-on: ubuntu-latest
    # One shell step resolving a version string.
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      push: ${{ steps.resolve.outputs.push }}
    steps:
      - name: Resolve version and push flag
        id: resolve
        run: |
          # Determine the version string from whichever trigger fired.
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            PUSH="true"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            PUSH="true"
          elif [ "${{ github.event_name }}" == "workflow_call" ]; then
            VERSION="${{ inputs.version }}"
            PUSH="true"
          else
            # push to main on containers/** -> build only, no publish.
            VERSION="ci-${GITHUB_SHA::7}"
            PUSH="false"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION push=$PUSH (event=${{ github.event_name }})"

  # ---------------------------------------------------------------------------
  # Build (and conditionally push) each image in parallel via a matrix.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.dir }}
    needs: setup
    runs-on: ubuntu-latest
    # Per-matrix-entry image build + push. The GPU/segmentation contexts are large
    # and a cold cache builds them from scratch, so this is generous — but it still
    # bounds the job well under GitHub's 360-minute default. release.yml calls this
    # workflow via `uses:`, which cannot carry its own timeout-minutes, so THIS is
    # where the release image build gets bounded.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # One entry per vendored build context under containers/, mapped to the
        # Docker Hub tag the modules pull it as.
        # VALIS is intentionally excluded: it uses the maintained upstream image
        # cdgatenbee/valis-wsi:1.0.0 (its from-source libvips build is heavy and
        # not worth re-hosting).
        include:
          - { dir: bioformats,     tag: convert_bioformats_2 }
          - { dir: preprocess,     tag: preprocess }
          - { dir: quantification, tag: quantification_gpu }
          - { dir: segmentation,   tag: segmentation_gpu }
          - { dir: cellsam,        tag: cellsam }
          - { dir: istantseg,      tag: instant_seg }
          - { dir: merge,          tag: merge }
          - { dir: debug_diffeo,   tag: debug_diffeo }
          - { dir: tiled,          tag: tiled }
          - { dir: spatialdata,    tag: spatialdata }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only authenticate when we actually intend to push.
      - name: Log in to Docker Hub
        if: needs.setup.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.dir }}
        uses: docker/build-push-action@v6
        with:
          context: containers/${{ matrix.dir }}
          file: containers/${{ matrix.dir }}/Dockerfile
          # Pin to linux/amd64 — the pipeline runs on amd64 HPC nodes.
          platforms: linux/amd64
          push: ${{ needs.setup.outputs.push == 'true' }}
          # Descriptive tag the modules pull (matches the single-repo convention).
          tags: ${{ env.IMAGE_REPO }}:${{ matrix.tag }}
          # Per-image GitHub Actions layer cache.
          cache-from: type=gha,scope=${{ matrix.dir }}
          cache-to: type=gha,scope=${{ matrix.dir }},mode=max
