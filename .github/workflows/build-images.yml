# =============================================================================
# Build & Push Container Images
# =============================================================================
# Builds every Docker image vendored under containers/<name>/ and pushes it to its OWN
# Docker Hub repository as bolt3x/mirage-<component>:<version>.
#
# ONE REPOSITORY PER IMAGE. The previous layout put all ten images in a single repository and
# used the tag to say WHICH image it was, so the tag namespace did two jobs at once --
# component names next to real versions (v2.3, v2.4) next to long-dead images -- and Docker
# Hub's per-repository tag ordering and vulnerability scanning were meaningless.
#
# The version reaches the tag. It previously did not: `version` was a required
# workflow_dispatch input, was resolved into an output, and was then never used, so every
# publish overwrote one mutable name and there was no prior image to roll back to.
#
# Triggers:
#   * workflow_dispatch     -> build + push, version supplied by the operator. The
#                              manual path, and the one that validates an image
#                              (e.g. :tiled) BEFORE a version is tagged.
#   * push to main (when    -> build ONLY (no push) so PRs/merges validate the
#     containers/** change)     Dockerfiles without publishing
#   * workflow_call         -> reusable; release.yml calls this with a version
#
# THERE IS DELIBERATELY NO `release: [published]` TRIGGER. This workflow used to carry
# one, so a published release started TWO publishing runs: this one directly, and
# release.yml's `publish-images` job via workflow_call. Only the second is gated --
# `publish-images` has `needs: [validate, test]` -- so the direct run pushed ten images
# to Docker Hub even when the release test gate was RED, contradicting release.yml's own
# header claim that nothing downstream happens unless `test` passes. Publishing on a
# release now flows through release.yml alone, behind that gate. If you re-add the
# trigger, restore the `github.event_name == "release"` branch of the version resolver
# below with it, and understand that you are restoring the ungated push along with it.
#
# Auth: docker/login-action -> Docker Hub using DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
#       repository secrets (Settings -> Secrets and variables -> Actions).
# Caching: GitHub Actions cache backend (type=gha) for fast layer reuse.
# =============================================================================
name: Build Images

on:
  # Manual trigger -> build & push, version supplied by the operator.
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version to publish, matching manifest.version (e.g. 1.0.0; a leading v is stripped)'
        required: true
        type: string
      only:
        description: >-
          Build ONLY these containers/ dirs (comma-separated, e.g. "segeval" or
          "segeval,tiled"). Leave empty to build every image. These are MUTABLE
          descriptive tags, so an all-images dispatch republishes ten images you
          did not change -- narrow it unless you mean to rebuild everything.
        required: false
        default: ''
        type: string

  # Changes to any vendored container -> build only (no push) as a sanity check.
  push:
    branches: [main]
    paths:
      - 'containers/**'
      - '.github/workflows/build-images.yml'

  # Reusable entry point so release.yml can invoke this workflow.
  workflow_call:
    inputs:
      version:
        description: 'Image version to publish, matching manifest.version (e.g. 1.0.0; a leading v is stripped)'
        required: true
        type: string
      ref:
        # A reusable workflow does its own checkout and sees the CALLER's
        # github.ref, NOT whatever the caller checked out. release.yml passes the
        # release TAG here so the images are built from the tagged, version-bumped
        # tree. Without it, a workflow_dispatch release built ten images from the
        # dispatch branch's un-bumped tree while `bump-and-tag` was still running --
        # so mirage-<component>:1.0.0 was built from a tree still saying the previous
        # version. Empty (the default, and every non-workflow_call trigger) means
        # actions/checkout's own default ref, i.e. unchanged behaviour.
        description: 'Git ref (tag/branch/SHA) to build the images from. Empty = the default ref.'
        required: false
        default: ''
        type: string

# Docker Hub push needs no special GITHUB_TOKEN scope; contents:read for checkout.
permissions:
  contents: read

# Serialize per ref; do NOT cancel — an interrupted run can leave a half-pushed
# image set on Docker Hub.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

env:
  # Docker Hub namespace. Each image gets its own repository beneath it, named
  # docker.io/<NAMESPACE>/mirage-<component>.
  IMAGE_NAMESPACE: docker.io/bolt3x

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the version/tag and whether we should push.
  # ---------------------------------------------------------------------------
  setup:
    name: Resolve build parameters
    runs-on: ubuntu-latest
    # One shell step resolving a version string.
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      push: ${{ steps.resolve.outputs.push }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Resolve version and push flag
        id: resolve
        run: |
          # Determine the version string from whichever trigger fired. There is no
          # `release` branch here because there is no `release` trigger -- see the header:
          # a published release reaches this workflow only through release.yml's gated
          # workflow_call, which arrives as event_name == "workflow_call".
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            PUSH="true"
          elif [ "${{ github.event_name }}" == "workflow_call" ]; then
            VERSION="${{ inputs.version }}"
            PUSH="true"
          else
            # push to main on containers/** -> build only, no publish.
            VERSION="ci-${GITHUB_SHA::7}"
            PUSH="false"
          fi
          # Strip a leading "v". GitHub release tags are conventionally v1.0.0 while
          # nextflow.config's manifest.version -- which is what modules/local/*.nf pin in the
          # image reference -- is 1.0.0. Without this the release path publishes
          # mirage-convert:v1.0.0 and every process then fails to pull mirage-convert:1.0.0.
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION push=$PUSH (event=${{ github.event_name }})"

      # Fail once, here, rather than ten times in parallel with an error that names neither
      # the missing secret nor the fix. This path went unexercised for months: the login step
      # in `build` is guarded by `push == 'true'`, and every push-to-main run is build-only, so
      # a green Build Images run never demonstrated that publishing could work at all.
      - name: Preflight registry credentials
        if: steps.resolve.outputs.push == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -z "$DOCKERHUB_USERNAME" ] && missing="$missing DOCKERHUB_USERNAME"
          [ -z "$DOCKERHUB_TOKEN" ] && missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Cannot publish: missing repository secret(s):$missing"
            echo "Set them with:"
            echo "  gh secret set DOCKERHUB_USERNAME --repo ${{ github.repository }} --body <docker-hub-user>"
            echo "  gh secret set DOCKERHUB_TOKEN    --repo ${{ github.repository }}"
            echo "The token needs Read & Write scope (hub.docker.com -> Account Settings ->"
            echo "Personal access tokens). Note that repositories created by a first push may"
            echo "default to PRIVATE; the cluster pulls these anonymously, so they must be public."
            exit 1
          fi
          echo "Registry credentials present for user: $DOCKERHUB_USERNAME"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Empty on every trigger but workflow_call -> actions/checkout's default.
          ref: ${{ inputs.ref }}

      # The image list lives in ONE place (containers/images.json) so the matrix
      # and the `only` filter cannot disagree. Selecting a subset is filtering
      # that list, never maintaining a second copy of it.
      - name: Resolve the build matrix
        id: matrix
        run: |
          ONLY="${{ github.event.inputs.only }}"
          if [ -z "$ONLY" ]; then
            MATRIX=$(jq -c '.' containers/images.json)
            echo "Building every image."
          else
            # Fail loudly on a name that matches nothing: a typo'd --only would
            # otherwise produce an empty matrix, a green run, and no image.
            MATRIX=$(jq -c --arg only "$ONLY" \
              '($only | split(",") | map(gsub("^\\s+|\\s+$";""))) as $want
               | map(select(.dir as $d | $want | index($d)))' containers/images.json)
            COUNT=$(echo "$MATRIX" | jq 'length')
            WANT=$(echo "$ONLY" | tr ',' '\n' | sed '/^\s*$/d' | wc -l | tr -d ' ')
            if [ "$COUNT" -ne "$WANT" ]; then
              echo "::error::--only='$ONLY' matched $COUNT of $WANT name(s)." \
                   "Valid dirs: $(jq -r '[.[].dir] | join(", ")' containers/images.json)"
              exit 1
            fi
            echo "Building only: $ONLY"
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX" | jq -r '.[] | "  \(.dir) -> \(.tag)"'

  # ---------------------------------------------------------------------------
  # Build (and conditionally push) each image in parallel via a matrix.
  # ---------------------------------------------------------------------------
  build:
    name: Build mirage-${{ matrix.dir }}
    needs: setup
    runs-on: ubuntu-latest
    # Per-matrix-entry image build + push. The GPU/segmentation contexts are large
    # and a cold cache builds them from scratch, so this is generous — but it still
    # bounds the job well under GitHub's 360-minute default. release.yml calls this
    # workflow via `uses:`, which cannot carry its own timeout-minutes, so THIS is
    # where the release image build gets bounded.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # From containers/images.json via the setup job, so the `only` filter and the full
        # list are the same list -- tests/test_container_build_matrix.py fails if an inline
        # copy reappears here, because a second copy drifts. The directory name IS the
        # component name, so the build context, the Docker Hub repository
        # (mirage-<dir>) and the reference in modules/local/*.nf all say the same word;
        # tests/test_container_image_naming.py asserts that agreement.
        # VALIS is intentionally absent: it uses the maintained upstream image
        # cdgatenbee/valis-wsi:1.0.0 (its from-source libvips build is heavy and not
        # worth re-hosting).
        include: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Same ref the setup job resolved the matrix from, so the build context
          # and the image list can never come from two different commits.
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only authenticate when we actually intend to push.
      - name: Log in to Docker Hub
        if: needs.setup.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push mirage-${{ matrix.dir }}
        uses: docker/build-push-action@v6
        with:
          context: containers/${{ matrix.dir }}
          file: containers/${{ matrix.dir }}/Dockerfile
          # Pin to linux/amd64 — the pipeline runs on amd64 HPC nodes.
          platforms: linux/amd64
          push: ${{ needs.setup.outputs.push == 'true' }}
          # The exact immutable tag the modules pull, plus a moving major-line tag for humans.
          # `:latest` is deliberately absent -- the pipeline never pulls it.
          tags: ${{ env.IMAGE_NAMESPACE }}/mirage-${{ matrix.dir }}:${{ needs.setup.outputs.version }}
          # Per-image GitHub Actions layer cache.
          cache-from: type=gha,scope=${{ matrix.dir }}
          cache-to: type=gha,scope=${{ matrix.dir }},mode=max
