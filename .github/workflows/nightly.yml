# =============================================================================
# Nightly (advisory suites)
# =============================================================================
# THIS WORKFLOW EXISTS SO THAT A RED `ci.yml` MEANS SOMETHING.
#
# `nf-test-real` and `nf-test-integration` used to live in ci.yml. Both were
# advisory in the only way this repository permits -- absent from the `all-tests`
# gate's `needs:` list, never `continue-on-error` -- and that was correct as far
# as the GATE went. It was not enough for the RUN. A GitHub Actions run's
# conclusion is the worst conclusion of any job in it, gate membership included
# or not, so on every push to main or dev the blocking gate passed, `nf-test
# (real)` failed, and the run reported `failure`: a red X on the commit, a red
# badge, a red PR checks list. Verified on 84cc53f. That trains people to ignore
# red, which is the failure mode the whole CI redesign is against.
#
# Moving the two jobs into their own workflow fixes it at the level it is broken:
# ci.yml is now green exactly when its gate is green, and the advisory suites
# keep their own honest history to trend. Nothing here is `continue-on-error` and
# nothing here is `|| true` -- a nightly job that fails FAILS, visibly, in this
# workflow's own status. That is the point of giving it a status of its own.
#
# -----------------------------------------------------------------------------
# THIS MOVE IS A DEFERRAL, NOT A FIX. READ THIS BEFORE ASSUMING IT WAS GREEN.
# -----------------------------------------------------------------------------
# `nf-test (real)` was RED at the moment it was moved here and it is still not
# green. What follows is the CURRENT list, re-measured on a real dispatch rather
# than carried over: run 33633986188 (2026-09-02) against release/p01-suite-truth,
# https://github.com/sceriff0/mirage/actions/runs/33633986188 --
# `FAILURE: Executed 28 tests in 1226.191s (14 failed)`.
#
# FIXED 2026-09-02 (release 1.0.0, plan 01 -- suite truth):
#
#   1. `tests/testdata/P001_nuclei_mask.tif` was EMPTY on the runner, so
#      `MIRAGE:READ_SEGMENTED_CHECKPOINT:EXTRACT_NUCLEI_PROPERTIES (P001)` aborted
#      with `tifffile.TiffFileError: not a TIFF file b''`. It was one of FIVE
#      fixtures TRACKED AT ZERO BYTES. FOUR of the five -- P001_image.tiff,
#      P001_merged_quant.csv, P001_nuclei_mask.tif, P001_pyramid.ome.tiff -- are
#      generated by tests/testdata/generate_complete_testdata.py now. The fifth,
#      dummy_singularity.sif, is STILL zero bytes and is meant to be: Nextflow's
#      Singularity engine only needs the path to exist to treat the image as
#      already-local and skip `singularity pull`, nothing ever opens it, and it is
#      allowlisted in tests/test_fixtures_have_a_producer.py's EMPTY_ON_PURPOSE
#      with that reason. That guard no longer accepts any OTHER fixture that
#      exists but cannot be opened. The string `not a TIFF file` appears ZERO
#      times in the run above, and EXTRACT_NUCLEI_PROPERTIES completes for both
#      patients in every pipeline-level test in it.
#   2. The exported GeoJSON carried 0 features against 20 rows in the
#      quantification CSV. This was NOT downstream of (1), as this header used to
#      say: the failing case is tests/modules/export_geojson.nf.test's real test,
#      whose only inputs are sample_merged_quant.csv and sample_contours.json.
#      Two fixture defects -- a quantification CSV with `centroid_x`/`centroid_y`
#      where every producer writes `x`/`y`, and a contours JSON that wrapped each
#      ring in a `coordinates` key. Both fixed in the generator; reproduced and
#      re-verified locally in a second by
#      tests/test_export_geojson_fixture_contract.py, which runs in the BLOCKING
#      suite because `--tag real` runs on the schedule against the default branch
#      only, i.e. nowhere at all on dev. Both real export_geojson cases PASSED in
#      the run above.
#
# STILL RED: 14 of 28 in `real`, in five distinct families, all measured on run
# 33633986188. NONE of the five is a fixture defect, so none is fixed here; each
# names what would fix it.
#
#   3. WAS "the preprocessed and registered `.ome.tif` outputs never appear at
#      all". They DO appear -- in the work directory -- and are never PUBLISHED.
#      Two tests, both in tests/integration/full_pipeline.nf.test:
#        java.lang.AssertionError: Preprocessed image should exist:
#          .../output/P001/preprocessed/P001_mov1_DAPI_CD3_CD8_corrected.ome.tif
#        java.lang.AssertionError: Registered image should exist:
#          .../output/P001/registered/registered_slides/P001_mov1_registered.ome.tiff
#      Those name exactly the two publishDir entries in conf/modules.config that
#      carry `enabled: params.cleanup_level == 'none'` (APPLY_PROFILES, REGISTER).
#      A plain boolean there is evaluated EAGERLY, where it appears, and that is
#      before `profiles {}` runs -- so a profile pin never reaches it, and
#      nf-test's own `-profile test,docker` is a profile. Measured statically in a
#      second, no CI needed: `nextflow config -profile test,docker` reports
#      `cleanup_level = 'none'` and STILL renders 15 gates as `enabled:false`,
#      those two among them; the same command with the value passed on the command
#      line renders 0. The workflow-side half of the same decision,
#      Checkpoint.writesAtLevel, reads params at RUN time, where the profile HAS
#      applied -- so csv/preprocessed.csv is written, naming files that were never
#      published. That dangling manifest is the exact outcome the filter in
#      subworkflows/local/preprocess.nf exists to prevent. Owned by whichever
#      change settles what conf/test.config's pin can actually reach; CLAUDE.md
#      records the same measurement and why it was left alone (changing what
#      `-profile test` effectively pins risks the 78-stub-test snapshot failure).
#   4. EIGHT of the fourteen are assertions that treat an nf-test output path as a
#      File. `process.out.<x>.get(0).get(1)` is a String, so `.size()` returns the
#      LENGTH OF THE PATH and `.name` / `.toFile()` do not exist:
#        assert it.size() > 1000  ->  161, for a 161-character path
#        groovy.lang.MissingMethodException: No signature of method:
#          java.lang.String.toFile()
#        groovy.lang.MissingPropertyException: No such property: name for class:
#          java.lang.String
#      Affected: convert_image, generate_preprocess_qc, generate_registration_qc,
#      merge_and_pyramid, split_channels (x2), and the preprocessing and
#      registration subworkflow tests. These CANNOT pass whatever the pipeline
#      does; the stub-tagged cases in the same files wrap with `file(...)` and are
#      green. A test-code repair, not a pipeline one.
#   5. One stale assertion against a default that moved. tests/modules/quantify
#      asserts 11 columns "(label + marker + 3 statistics x 3 compartments)" and
#      gets 5: [label, DAPI, DAPI: Nucleus: Median, DAPI: Cytoplasm: Median,
#      DAPI: Cell: Median]. `expanded_quantification` ships false, so Median alone
#      is computed. The pipeline is right and the test was never updated.
#   6. One pipeline-facing defect -- the only one of the fourteen. The postprocess
#      subworkflow's real test leaves pixel_size unset, it reaches the process as
#      the literal string `null`, and EXPORT_GEOJSON (P001) exits 1 with
#      `pixel_size.PixelSizeError: --pixel_size 'null' is neither a number nor
#      'auto'` (bin/utils/pixel_size.py:295).
#   7. The synthetic-data segmentation wall, RE-MEASURED and still holding -- this
#      header used to say it had not been re-measured. SEGMENT's regression case
#      gets a 145-byte cell mask and a 147-byte nuclei mask (an all-zero label
#      image), and MERGE_AND_PYRAMID's gets a 135-byte pyramid. See the job's own
#      comment below for the diagnosis (StarDist's 2D_versatile_fluo finds no
#      nuclei in smooth synthetic blobs) and the two candidate fixes.
#
# `nf-test (integration)` CONTRIBUTES NO INDEPENDENT FAILURE. It ran 5 tests and
# failed 2, and those 2 are test ids 1387f758 and 47ddb28b -- the same two cases
# as (3) above, in the same file. tests/integration/full_pipeline.nf.test carries
# a file-level `tag "integration"` and a per-test `tag "real"`, so four of its five
# cases are collected by BOTH legs. Fixing (3) turns both jobs green together.
#
# A job moved to a nightly workflow with no note reads as "this always passed
# somewhere else", which is false here. When these are fixed, the job goes back
# into ci.yml's `all-tests` gate and this section gets deleted with it.
#
# -----------------------------------------------------------------------------
# GATING, AND WHAT WAS PRESERVED
# -----------------------------------------------------------------------------
# `nf-test-integration` did NOT run on every push in ci.yml either: it carried
# `if: github.event_name == 'workflow_dispatch'`, i.e. it ran only when a human
# fired the workflow by hand. That is preserved EXACTLY -- the same `if:` is on
# the job below, so the nightly schedule runs `nf-test-real` only and the
# integration suite is still a deliberate, manual act. Moving it here without
# that condition would have quietly promoted a manually-triggered 2-hour suite
# into something that runs unattended every night.
#
# `nf-test-real` ran on `push` to main AND dev in ci.yml. Here it runs on the
# schedule and on a manual dispatch, which is the trade this move makes: the
# signal is one run per day instead of one per push, and in exchange a push's
# status tells the truth about the gate.
#
# BE PRECISE ABOUT WHAT dev LOSES. `schedule:` fires on the DEFAULT BRANCH ONLY --
# GitHub runs the workflow file as it exists on `main`, against `main`. So dev's
# real-suite coverage drops from "every push" to ZERO, and the only way to run the
# real suite against dev is a manual `workflow_dispatch` with the branch selected.
# That is a real reduction and it is being made deliberately: the suite is red
# today (see above), so what dev is losing is a signal nobody could read anyway,
# and restoring per-push coverage on a branch is the wrong shape for a suite that
# takes two hours. If dev needs it back once the suite is green, the fix is a
# `push:` trigger here with `branches: [dev]` -- a decision to take then, on a
# green suite, not now.
#
# The `docs` job below is in exactly the same position: `schedule:` runs this
# file as it exists on the default branch, so the strict mkdocs build has ZERO
# coverage on `dev` or any feature/release branch -- only a manual
# `workflow_dispatch` against that branch exercises it there.
#
# 05:17 UTC is deliberately not on the hour: GitHub's scheduler queues heavily at
# :00 and can delay or drop a run entirely under load.
# =============================================================================
name: Nightly

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

# Least-privilege default token: read-only, as in ci.yml.
permissions:
  contents: read

# Never cancel a nightly in flight: a half-run advisory suite reports a failure
# that is indistinguishable from a real one, which is the exact confusion this
# workflow exists to remove.
concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NFTEST_VERSION: '0.9.0'
  # Same mechanism as ci.yml and release.yml: one cacheable plugins directory
  # instead of ~/.nextflow/plugins, which is also the air-gapped NXF_PLUGINS_DIR
  # path docs/usage.md documents.
  NXF_PLUGINS_DIR: ${{ github.workspace }}/.nextflow-plugins

jobs:
  # ============================================================================
  # Container images — the full static matrix, build-only
  # ============================================================================
  # ADDED 2026-09-01 (CI redesign, Phase 6). THIS IS THE ONLY MECHANISM IN THE
  # REPOSITORY THAT CAN DETECT AN IMAGE WHICH STOPPED BUILDING FOR A REASON OUTSIDE
  # THE REPOSITORY, and that is a failure this project has already had: an apt repo
  # that moves, a wheel that is yanked, a git host that deletes a project.
  # containers/regqc carried `pip install git+https://github.com/sceriff0/cudipy.git`
  # for months after that repository ceased to exist -- the image could not be built
  # AT ALL -- and nothing noticed, because `build-images.yml` only ran when someone
  # pushed a change to containers/**. ci.yml's changed-only build closes the "a PR
  # broke it" half; this closes the "nobody touched it and it broke anyway" half.
  # Neither alone is enough.
  #
  # Build-only, and build-only is the whole cost story: no `version:` input means
  # containers.yml resolves push=false, and ten of the eleven images come back from
  # the `type=gha` layer cache in minutes. The cost is paid only by whichever image's
  # upstream actually broke -- which is exactly the run you want to be paying for.
  #
  # ADVISORY BY LOCATION, like everything else here: nothing in this workflow is in
  # any merge gate, and nothing here is `continue-on-error` or `|| true`. A nightly
  # image build that fails FAILS, visibly, in this workflow's own status.
  containers:
    name: Container images (full matrix)
    uses: ./.github/workflows/containers.yml
    # Every input defaulted on purpose: no `version` (build only, never push), no
    # `ref` (the default branch), `scope: all` (all eleven from
    # containers/images.json), no `only` filter.
    permissions:
      contents: read

  # ============================================================================
  # nf-test real suite
  # ============================================================================
  nf-test-real:
    name: nf-test (real)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # ADVISORY BY LOCATION, and by nothing else. There is no `continue-on-error`
    # here and there must never be one: it makes `needs.<job>.result` report
    # `success` for a job that failed, which is strictly worse than `|| true`
    # (at least `|| true` is local and visible on one line). This job is advisory
    # because it is in a workflow no merge is gated on -- and it still reports its
    # true colour, which is the whole trade.
    #
    # The diagnosis behind the header's cause (7), kept here because it is older
    # than the rest and was measured in a different round: registration,
    # segmentation model-loading and most test-staging bugs are fixed (the suite
    # went 26 -> ~20 failing, and is 14 of 28 on run 33633986188); what remains of
    # THAT round is the synthetic-data segmentation wall -- StarDist's built-in
    # 2D_versatile_fluo detects 0 nuclei in the smooth synthetic test blobs even at
    # a low prob_thresh, so cell/quant/geojson assertions cannot pass on this
    # fixture data. The fix is to bundle a tiny real nuclei crop, or to weaken
    # those assertions to "runs without error".
    #
    # Put this job back in ci.yml's `all-tests` gate once it is green. That is the
    # end state; this workflow is where it waits, not where it belongs.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nextflow and nf-test
        # The action pins Nextflow to the supported release by default: nf-test
        # 0.9.0's generated test wrappers do not compile under edge Nextflow's
        # strict parser.
        uses: ./.github/actions/setup-nf-test
        with:
          nf-test-version: ${{ env.NFTEST_VERSION }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Generate test data
        uses: ./.github/actions/generate-testdata

      - name: Run nf-test real suite
        run: |
          nf-test test --profile test,docker --tag real --verbose

      - name: Upload nf-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nf-test-real-results
          path: |
            .nf-test/
            tests/output/

  # ============================================================================
  # nf-test integration suite (manual trigger only -- NOT on the schedule)
  # ============================================================================
  nf-test-integration:
    name: nf-test (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # PRESERVED VERBATIM from ci.yml. This job has never run on a schedule or on
    # a push; it ran only when someone dispatched the workflow by hand, and it
    # still does. Deleting this line would turn a deliberate 2-hour manual suite
    # into an unattended nightly one, which is a change nobody asked for and
    # which the move itself makes very easy to do by accident.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nextflow and nf-test
        # The action pins Nextflow to the supported release by default: nf-test
        # 0.9.0's generated test wrappers do not compile under edge Nextflow's
        # strict parser.
        uses: ./.github/actions/setup-nf-test
        with:
          nf-test-version: ${{ env.NFTEST_VERSION }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Generate test data
        uses: ./.github/actions/generate-testdata

      - name: Run nf-test integration suite
        run: |
          nf-test test --profile test,docker --tag integration --verbose

      - name: Upload nf-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nf-test-integration-results
          path: |
            .nf-test/
            tests/output/

  # ============================================================================
  # Documentation build (mkdocs --strict)
  # ============================================================================
  # LIVES HERE, NOT IN _test-suite.yml, BECAUSE OF WHAT "NON-BLOCKING" ACTUALLY
  # MEANS FOR A REUSABLE WORKFLOW. Measured on CI run 33641966166: every blocking
  # leg and `Suite gate` succeeded, but ci.yml's `All Tests` FAILED with "The
  # shared test suite did not pass (result: failure)". Being outside
  # `suite-gate`'s `needs:` does not make a job non-blocking -- a called reusable
  # workflow's conclusion is the worst conclusion of ANY job inside it, gate
  # membership included or not, so this job's red concluded `_test-suite.yml`
  # itself as `failure` and ci.yml's `all-tests` reads that one result. Same
  # mechanism this file's own header describes for `nf-test-real` in ci.yml,
  # discovered a second time because the earlier fix put the job in the wrong
  # kind of file rather than the wrong `needs:` list.
  #
  # `--strict` plus the `validation:` block in mkdocs.yml turns three categories
  # that default to `info` -- orphan pages, dangling anchors, dead relative links
  # -- into a failed build. mkdocs 1.6 has no `error` level; `warn` + `--strict`
  # IS the mechanism (see mkdocs.yml's own note).
  #
  # THIS JOB IS RED THE DAY IT LANDS, same as `nf-test-real` above: 2 orphan
  # pages (nextflow-26-bump.md, perf/2026-08-26-rss.md) and 3 dangling anchors,
  # measured 2026-09-02, reported as 4 warnings. No `continue-on-error` and no
  # `|| true` -- a failing docs build FAILS here, visibly, in this workflow's own
  # status, which is the entire point of nightly.yml existing.
  #
  # Plan 12 (the docs phase of this release) fixes those four warnings and moves
  # this job BACK into `_test-suite.yml` as a blocking, gate-enumerated job --
  # added to `suite-gate`'s `needs:` and to GATE_MEMBERSHIP["_test-suite.yml"] in
  # tests/test_release_workflow_graph.py. Until then it stays here, where a red
  # result cannot fail a caller's gate: nightly.yml carries no gate aggregator at
  # all, so `test_every_job_is_connected_to_its_workflows_gate` and
  # `GATE_DISCONNECTED_JOBS` do not apply to it -- there is no gate here for the
  # job to be disconnected from.
  docs:
    name: Docs build (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # FULL HISTORY, unlike the two nf-test jobs above. mkdocs.yml loads
          # mkdocs-git-revision-date-localized, which reads each page's last-commit
          # date out of git. On the default shallow clone it falls back to the
          # build date and logs a WARNING to do so -- and under `--strict` a
          # warning is an abort, so a shallow checkout would fail this job for a
          # reason that has nothing to do with the documentation.
          fetch-depth: 0

      - name: Set up Python and install the docs stack
        # docs/requirements.txt, not a requirements/ file: this stack is
        # documentation tooling, shares no package with any container image, and
        # Read the Docs installs the same file. tests/test_ci_stack_pinned.py's
        # rules are satisfied -- the install goes through `-r`, and no version
        # string appears in this YAML.
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.10'
          requirements: 'docs/requirements.txt'

      - name: Build the documentation
        run: |
          mkdocs build --strict --site-dir _site

      - name: Upload the built site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: _site/
