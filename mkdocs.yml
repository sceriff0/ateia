site_name: MIRAGE Pipeline
site_description: >-
  Nextflow DSL2 pipeline for multiplex whole-slide microscopy — illumination
  correction, registration, segmentation, single-cell quantification, and
  QuPath-compatible export.
site_author: MIRAGE Team
site_url: https://mirage.readthedocs.io/
repo_url: https://github.com/sceriff0/mirage
repo_name: sceriff0/mirage
edit_uri: edit/main/docs/
copyright: >-
  Copyright &copy; MIRAGE Team — released under the MIT License.

# Author-facing helper files that should not become published pages
exclude_docs: |
  assets/images/README.md
  superpowers/

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    # Navigation
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    # Search
    - search.highlight
    - search.suggest
    - search.share
    # Content
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
plugins:
  - search
  - include-markdown
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true

# ---------------------------------------------------------------------------
# Navigation
# ---------------------------------------------------------------------------
nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting_started.md
      - Installation: installation.md
      - Walkthrough: walkthrough.md
  - User Guide:
      - Pipeline Architecture: workflow.md
      - Samplesheet & Input: input_spec.md
      - Output Files: outputs.md
      - Restartability & Checkpoints: restartability_guide.md
      - Running on HPC / SLURM: slurm.md
      - Benchmarks & Performance: benchmarks.md
  - Pipeline Stages:
      - Preprocessing: preprocessing.md
      - Registration: registration_methods.md
      - Registration Error Metrics: registration_errors.md
      - Feature Distance Estimation: estimate_feature_distances.md
      - Segmentation: segmentation.md
      - Quantification: quantification.md
      - Visualization & Export: export.md
  - Downstream:
      - FlowPath Ecosystem: flowpath.md
  - Reference:
      - CLI & Usage: usage.md
      - Parameters: parameters.md
  - Help:
      - Troubleshooting: troubleshooting.md
      - FAQ: faq.md
      - Testing: testing_guide.md
      - Developer Guide: developer_guide.md
      - Changelog: changelog.md
      - Citation: citation.md

# ---------------------------------------------------------------------------
# Appearance extras
# ---------------------------------------------------------------------------
extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sceriff0/mirage
      name: MIRAGE on GitHub
  generator: false

# ---------------------------------------------------------------------------
# Markdown extensions
# ---------------------------------------------------------------------------
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
