# Panel for the method_paper cohort (046, 052, 5456, 10338, 15897, 24086, 37895).
# TRANSCRIBED FROM cell_classification.svg, plus an explicit myeloid branch (CD14/CD163)
# that the figure leaves out -- see "Myeloid extension" below.
#
# 10 rounds x 2 non-nuclear channels = 20 channels. DAPI is the fiducial
# (params.nuclear_markers) and is never a panel marker. `wrongL1CAM` (round
# *_DAPI_l1cam_PD1) is a mislabelled duplicate and is DELIBERATELY OMITTED --
# the real L1CAM comes from the FSP1 round.
#
# Marker names must match the samplesheet `channels` column EXACTLY, case included:
# the measurement key is "<marker>: <Compartment>: <Statistic>" (bin/utils/measurements.py).
# Hence PANCK / PDL1 / VIMENTIN in caps, not PanCK / PD-L1 / Vimentin.
#
# STATISTIC POLICY: Median everywhere, except GZMB.
#   Median is ALWAYS computed (nextflow.config:175) whereas Mean needs
#   expanded_quantification=true, and the median is far more resistant to the two
#   artifacts that dominate this cohort: lateral spillover from neighbouring cells in
#   dense tumour, and sub-cellular registration error across 10 rounds. GZMB is the
#   one exception: cytotoxic granules cover a small minority of cytoplasm pixels, so
#   the median of a GZMB-positive cell sits in its own background and positives stop
#   separating from negatives. GZMB gates two leaves, so that separation matters.
#
# The figure's "VIM" is the VIMENTIN channel; the figure's "Unknown" leaf is the
# compiler's built-in `Unclassified` and is therefore NOT declared here.

markers:
  # ---- lineage / GATING (12): the markers that split the tree ----
  CD45:     {role: lineage, compartment: cytoplasm, statistic: Median}
  CD3:      {role: lineage, compartment: cytoplasm, statistic: Median}
  CD8:      {role: lineage, compartment: cytoplasm, statistic: Median}
  CD4:      {role: lineage, compartment: cytoplasm, statistic: Median}
  CD56:     {role: lineage, compartment: cytoplasm, statistic: Median}
  CD14:     {role: lineage, compartment: cytoplasm, statistic: Median}
  CD163:    {role: lineage, compartment: cytoplasm, statistic: Median}
  GZMB:     {role: lineage, compartment: cytoplasm, statistic: Mean, negative_reference: PANCK_Tumor}
  FOXP3:    {role: lineage, compartment: nuclear,   statistic: Median}
  SMA:      {role: lineage, compartment: cytoplasm, statistic: Median}
  PANCK:    {role: lineage, compartment: cytoplasm, statistic: Median}
  VIMENTIN: {role: lineage, compartment: cytoplasm, statistic: Median}

  # ---- state / FUNCTIONAL: "recorded per cell but do not affect the phenotype call" ----
  CD74:     {role: state, compartment: cytoplasm, statistic: Median}
  L1CAM:    {role: state, compartment: cytoplasm, statistic: Median, negative_reference: Immune, positive_reference: PANCK_Tumor}
  P53:      {role: state, compartment: nuclear,   statistic: Median, negative_reference: Immune}
  PDL1:     {role: state, compartment: cytoplasm, statistic: Median, negative_reference: T_helper}
  PD1:      {role: state, compartment: cytoplasm, statistic: Median}
  ARID1A:   {role: state, compartment: nuclear,   statistic: Median, positive_reference: Immune}
  FSP1:     {role: state, compartment: cytoplasm, statistic: Median}

phenotypes:
  # --- CD45+ arm. Both "Immune" leaves of the figure (CD3+CD8-CD4-, and CD3-CD56-)
  # --- collapse onto this one node: any CD45+ cell that matches no deeper leaf
  # --- lands here by specificity, which reproduces the tree exactly.
  Immune: {CD45: "+"}

  Activated_T_cytotoxic: {parent: Immune, CD3: "+", CD8: "+", GZMB: "+"}
  CD8_Treg:              {parent: Immune, CD3: "+", CD8: "+", GZMB: "-", FOXP3: "+"}
  T_cytotoxic:           {parent: Immune, CD3: "+", CD8: "+", GZMB: "-", FOXP3: "-"}
  CD4_Treg:              {parent: Immune, CD3: "+", CD8: "-", CD4: "+", FOXP3: "+"}
  T_helper:              {parent: Immune, CD3: "+", CD8: "-", CD4: "+", FOXP3: "-"}
  Activated_NK:          {parent: Immune, CD3: "-", CD56: "+", GZMB: "+"}
  NK_cell:               {parent: Immune, CD3: "-", CD56: "+", GZMB: "-"}

  # --- Myeloid extension (NOT in cell_classification.svg). Slots into the branch the
  # --- figure dead-ends at plain "Immune": CD45+ CD3- CD56-. CD56:"-" keeps NK
  # --- winning a CD14+CD56+ cell, matching the figure's CD56-before-anything order.
  # --- A CD14+CD163- cell falls back to Myeloid by specificity; no M1 leaf is asserted.
  Myeloid:               {parent: Immune, CD3: "-", CD56: "-", CD14: "+"}
  Macrophage_M2:         {parent: Myeloid, CD163: "+"}

  # --- CD45- arm. Gate order SMA -> PANCK -> VIMENTIN is encoded as explicit
  # --- negatives, so e.g. a PANCK+SMA+ cell resolves to Stroma as the tree does.
  Stroma:      {CD45: "-", SMA: "+"}
  PANCK_Tumor: {CD45: "-", SMA: "-", PANCK: "+"}
  VIM_Tumor:   {CD45: "-", SMA: "-", PANCK: "-", VIMENTIN: "+"}

constraints:
  exclusive:
    - {markers: [PANCK, CD45],     rate: never}
    - {markers: [PANCK, CD3],      rate: never}
    - {markers: [CD45, SMA],       rate: never}
    - {markers: [CD3, CD14],       rate: never}
    - {markers: [CD4, CD8],        rate: rare, r: 0.01}
    - {markers: [CD3, CD56],       rate: rare, r: 0.02}
    - {markers: [PANCK, VIMENTIN], rate: soft, r: 0.05}
  requires:
    # Mirror the tree's gate order: a marker is only ever read below its parent gate.
    - {if: CD3,   then: CD45}
    - {if: CD56,  then: CD45}
    - {if: CD14,  then: CD45}
    - {if: CD8,   then: CD3}
    - {if: CD4,   then: CD3}
    - {if: FOXP3, then: CD3}
    - {if: CD163, then: CD14}
    # State markers: zero cube cost (_violates_requires ignores non-lineage
    # markers) but they still resolve calibration anchors via the contrapositive.
    - {if: PD1,   then: CD45}
    - {if: CD74,  then: CD45}
    - {if: FSP1,  then: VIMENTIN}
