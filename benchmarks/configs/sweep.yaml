# Benchmark sweep definition. strategy: ofat (one-factor-at-a-time) | grid.
#
# Coverage: input scale (target_px, n_channels) + per-stage resource knobs across
# preprocessing, registration, segmentation and quantification. Each axis maps to a
# --<name> CLI override; target_px/n_channels drive the synthetic image matrix.
#
# NOTE (registration): the registration axes only exercise real VALIS registration when
# the matrix was generated with --paired (reference+moving panel per cell, distinct
# channel names). Without --paired, registration is a single-slide passthrough no-op.
#
# REMOVED axes: reg_use_tiled_registration, reg_tile_size, reg_n_workers (VALIS auto-tiles
# internally, so they were no-ops) and reg_parallel_warping (parallel warping was removed;
# warping is always sequential). The matching pipeline params are removed from the pipeline.
#
# N-IMAGE REGISTRATION: n_register_images sweeps the number of slides registered together
# (1 reference + N-1 moving panels). Generate the matrix straight from this file so it has
# enough moving images — no manual sync:
#     python benchmarks/generate_matrix.py --source img.ome.tif --outdir bench_matrix \
#         --sweep benchmarks/configs/sweep.yaml
# (--sweep derives target_px, n_channels, --n-moving = max(n_register_images)-1, and --paired.)
# run_sweep.sh then builds the N-panel samplesheet per run.
strategy: ofat

# Baseline = the fixed point for ofat (one value per axis).
baseline:
  # --- input scale ---
  target_px: 4096
  n_channels: 2
  # --- registration ---
  memory_mode: medium
  skip_micro_registration: true
  reg_distributed_tiling: false
  n_register_images: 2                # 1 reference + 1 moving (the classic pair)
  # --- preprocessing (BaSiC illumination correction) ---
  preproc_n_iter: 100
  preproc_overlap: 0
  preproc_pool_workers: 4             # worker threads for preprocessing parallelism
  # --- segmentation ---
  seg_method: stardist
  seg_gpu: true
  seg_n_tiles_x: 16
  seg_n_tiles_y: 16
  seg_cellsam_block_size: 400        # only used when seg_method=cellsam
  seg_instantseg_tile_size: 512      # only used when seg_method=instantseg
  # --- quantification ---
  # compartments ON at baseline so the expanded_quantification axis is valid:
  # expanded_quantification requires quantify_compartments (ParamUtils.validateCompartmentQuant).
  quantify_compartments: true
  expanded_quantification: false

# Axes to vary (OFAT: one run per non-baseline value of each axis).
axes:
  # --- input scale: the primary driver of the per-process memory regression ---
  target_px:                  [2048, 4096, 8192, 16384, 32768, 65536, 131072]
  n_channels:                 [1, 2, 4, 8]
  # --- registration ---
  memory_mode:                [low, medium, high]
  skip_micro_registration:    [true, false]
  n_register_images:          [2, 4, 8]           # panels registered together (1 ref + N-1 moving)
  # --- preprocessing ---
  preproc_n_iter:             [50, 100, 200]      # BaSiC iterations (compute/time)
  preproc_overlap:            [0, 64, 128]        # tile overlap (px)
  preproc_pool_workers:       [1, 4, 8]           # preprocessing parallelism (null pipeline default = task.cpus)
  # (preproc_tile_size deliberately NOT swept: it is problem-dependent.)
  # --- segmentation ---
  seg_method:                 [stardist, cellsam, instantseg]  # cellsam/instantseg need their weights + container on the cluster (must match ParamUtils valid names)
  seg_gpu:                    [true, false]
  seg_n_tiles_x:              [8, 16, 32]         # StarDist tiling (active when seg_method=stardist)
  seg_n_tiles_y:              [8, 16, 32]         # StarDist tiling (active when seg_method=stardist)
  # Method-specific tile params take effect ONLY when seg_method matches their backend.
  # Off the stardist baseline these OFAT runs reproduce the baseline (no variation); to
  # benchmark them, set baseline seg_method to the matching backend or use a per-backend grid.
  seg_cellsam_block_size:     [256, 400, 512]     # active when seg_method=cellsam
  seg_instantseg_tile_size:   [256, 512, 1024]    # active when seg_method=instantseg
  # --- quantification ---
  quantify_compartments:      [false, true]
  expanded_quantification:    [false, true]       # valid because baseline quantify_compartments=true
  # reg_distributed_tiling axis stays disabled: the Nextflow-distributed tiling path
  # (VALIS_DISTRIBUTED_ADAPTER) is currently broken. Baseline pins it to false.
  # Re-enable once the distributed path works: reg_distributed_tiling: [false, true]
