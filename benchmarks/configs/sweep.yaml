# Benchmark sweep definition. strategy: ofat (one-factor-at-a-time) | grid.
#
# Coverage: input scale (target_px, n_channels) + per-stage resource knobs across
# preprocessing, registration, segmentation and quantification. Each axis maps to a
# --<name> CLI override; target_px/n_channels drive the synthetic image matrix.
#
# NOTE (registration): the registration axes only exercise real VALIS registration when
# the matrix was generated with --paired (reference+moving panel per cell, distinct
# channel names). Without --paired, registration is a single-slide passthrough no-op.
#
# REMOVED axes: reg_use_tiled_registration, reg_tile_size, reg_n_workers (VALIS auto-tiles
# internally, so they were no-ops) and reg_parallel_warping (parallel warping was removed;
# warping is always sequential). The OLD distributed/tiled VALIS path was archived out of the
# pipeline (git tag archive/tiled-valis-2026-07-24), so reg_distributed_tiling / reg_dist_* and
# the distributed_grid / distributed_tiling_grid sweeps were removed — those params no longer exist.
#
# REGISTRATION METHODS: registration_method='valis' (feature-based rigid+non-rigid, the baseline)
# vs 'tiled' = STARE (JVM-free NumPy/skimage rigid + mesh registrar, merged from feat/tiled-registration
# @ c6477b1). STARE is NOT the old archived distributed path above — it is a distinct method that ships
# on main. Both methods are benchmarked head-to-head by registration_method_grid below (VALIS = baseline
# anchor; tiled = its own reg_tiled_* knobs). A THIRD baseline, Ashlar, is benchmarked out-of-band by the
# benchmarks/ashlar_eval/ harness (see the ASHLAR note at the bottom of this file).
#
# N-IMAGE REGISTRATION: n_register_images sweeps the number of slides registered together
# (1 reference + N-1 moving panels). Generate the matrix straight from this file so it has
# enough moving images — no manual sync:
#     python benchmarks/generate_matrix.py --source img.ome.tif --outdir bench_matrix \
#         --sweep benchmarks/configs/sweep.yaml
# (--sweep derives target_px, n_channels, --n-moving = max(n_register_images)-1, and --paired.)
# run_sweep.sh then builds the N-panel samplesheet per run.
strategy: ofat

# Input-scale grid for the memory/time SCALING study. Unlike the OFAT axes below
# (which move ONE knob off the baseline), this is a full cross-product so every
# (size x channels) combination is measured — the memory regression needs the 2-D
# grid, not a cross-shaped subset. Channels start at 2: single-channel does not
# exercise the multi-channel merge/registration path, so it is not benchmarked.
# generate_matrix.py --sweep builds exactly these cells; build_run_plan.py expands
# them into runs (labelled varied_axis=scaling_grid, plus the baseline cell).
scaling_grid:
  target_px:  [2048, 4096, 8192, 16384, 32768, 65536, 90000]  
  n_channels: [2, 4]                                     # 1 channel not benchmarked

# Registration-scaling grid: size x number-of-registered-rounds, at a FIXED channel
# count. n_register_images is a THIRD input-scaling dimension — REGISTER's input is
# the SUM of all rounds' bytes, and the merged image's channels grow with the number
# of rounds — so it must be measured ACROSS sizes, not only at the baseline cell.
# N=2 is omitted here because the scaling_grid already covers every (size, 2ch) cell
# at the baseline N=2 (the classic pair); this grid adds the 4- and 8-round points.
# These runs are labelled varied_axis=registration_grid and DO feed the memory
# regression (input genuinely varies with round count).
registration_grid:
  target_px:         [2048, 4096, 8192, 16384, 32768, 65536, 90000]
  n_register_images: [4, 8]
  n_channels:        [2, 4]     # benchmark N-image registration at BOTH 2 and 4 channels

# Baseline = the fixed point for ofat (one value per axis). Also the (4096, 2)
# cell of the scaling grid, so it is emitted once (labelled baseline).
baseline:
  # --- input scale (fixed here; varied by scaling_grid above) ---
  target_px: 32768 
  n_channels: 2
  # --- registration ---
  # NB: baseline mirrors the PIPELINE DEFAULTS (nextflow.config) so the 'baseline' run is the
  # shipped config. memory_mode=high and reg_qc=2 are the pipeline defaults as of 2026-07-27.
  registration_method: valis          # pipeline default: 'valis' | 'tiled' (STARE). This baseline is the
                                      # VALIS anchor; registration_method_grid below adds tiled/STARE runs.
  memory_mode: high                   # pipeline default (registration memory profile)
  reg_micro_reg: 0                    # pipeline default: micro-registration DEPTH (0=none | 1=micro-rigid |
                                      # 2=+micro non-rigid). Replaces the old boolean skip_micro_registration
                                      # (removed on main); crossed with memory_mode by registration_param_grid.
  reg_tiled_tile: 2048                # STARE tile core / mesh resolution (px), pipeline default. Only live when
                                      # registration_method=tiled; declared here (like the seg_* backend params)
                                      # so EVERY config shares columns — registration_method_grid crosses it.
  reg_tiled_gate_tre: 1.0             # STARE per-tile non-rigid refine gate (px), pipeline default. Only live for
                                      # tiled runs; declared for column uniformity (crossed by registration_method_grid).
  n_register_images: 2                # 1 reference + 1 moving (the classic pair)
  reg_qc: 2                           # pipeline default: staged registration QC ON — segments DAPI nuclei,
                                      # fixes correspondence at the rigid stage, re-measures dice_matched +
                                      # centroid displacement (um) per stage. Harvested into
                                      # registration_accuracy.csv (bin/warp_seg_qc.py; docs/registration_qc.md).
  reg_jvm_heap_gb: null               # auto-size; the reg_jvm_heap_gb axis varies it (RAM elasticity)
  # --- preprocessing (BaSiC illumination correction) ---
  preproc_n_iter: 100
  preproc_overlap: 0
  preproc_pool_workers: null          # pipeline default (null = task.cpus); the preproc_pool_workers axis
                                      # varies it to explicit thread counts
  # --- segmentation ---
  seg_method: stardist
  seg_gpu: true
  seg_n_tiles_x: 16
  seg_n_tiles_y: 16
  seg_cellsam_block_size: 1024        # pipeline default (only used when seg_method=cellsam)
  seg_instantseg_tile_size: 512       # only used when seg_method=instantseg
  skip_seg_quality_eval: false        # CellSegmentationEvaluator (CSE) ON: reference-free per-patient
                                      # segmentation QualityScore + component metrics, harvested into
                                      # segmentation_eval.csv (modules/local/seg_quality_eval.nf).
  cse_max_pixels: 50000000            # pipeline default: bin image+masks so CSE scores <= this many px
                                      # (caps CSE memory/time on full-WSI masks; QualityScore shifts with
                                      # the binning factor, so keep it FIXED across the cohort).
  # --- quantification ---
  # compartments ON at baseline so the expanded_quantification axis is valid:
  # expanded_quantification requires quantify_compartments (ParamUtils.validateCompartmentQuant).
  quantify_compartments: true         # pipeline default
  expanded_quantification: true       # pipeline default (Mean/Sum on top of the always-computed Median)

# Axes to vary (OFAT: one run per non-baseline value of each axis). These hold
# input size FIXED at the baseline cell and vary a single pipeline knob.
# NOTE: target_px / n_channels / n_register_images are NOT here — they are input-
# scaling dimensions owned by scaling_grid and registration_grid above (full grids),
# so listing them as OFAT axes would double-cover and confound the regression.
axes:
  # --- registration resource elasticity ---
  reg_jvm_heap_gb:            [16, 32, 64]        # does more BioFormats JVM heap speed up REGISTER, or
                                                  # just reserve idle RAM? (classic path; RAM response curve)
  # --- preprocessing ---
  preproc_pool_workers:       [1, 4, 8]           # preprocessing parallelism (null pipeline default = task.cpus)
  # --- segmentation ---
  seg_gpu:                    [true, false]       # NB: false may not be a true CPU run (issue #20)
  # --- quantification ---
  quantify_compartments:      [false, true]
  expanded_quantification:    [false, true]       # valid because baseline quantify_compartments=true
  # NOTE — the VALIS registration knobs (memory_mode, reg_micro_reg) are NOT OFAT axes: they are
  # crossed at the baseline cell by registration_param_grid below.
  # NOTE — registration_method is NOT an OFAT axis: it is a method grid (registration_method_grid), each
  # method run with its OWN live knobs (a tiled-only knob off the VALIS baseline would be a no-op).
  # NOTE — seg_method and its per-method params (seg_n_tiles_*, seg_cellsam_block_size,
  # seg_instantseg_tile_size) are NOT OFAT axes: segmentation_grid below runs each method with its OWN
  # live params (an OFAT run of a backend-specific param off the stardist baseline is a no-op).

# REGISTRATION PARAMETER GRID (VALIS) — memory_mode x reg_micro_reg crossed at the baseline cell, VALIS
# path only. Characterises the effect of the VALIS registration knobs on cost + accuracy. reg_micro_reg is
# the micro-registration DEPTH (0/1/2), replacing the old boolean skip_micro_registration (removed on main).
registration_param_grid:
  memory_mode:    [low, medium, high]
  reg_micro_reg:  [0, 1, 2]              # 0=none | 1=micro-rigid only | 2=+micro non-rigid

# SEGMENTATION GRID — each method benchmarked with ITS OWN parameters (pinned seg_method + that method's
# live knobs crossed). stardist crosses its tile grid; cellsam its block size; instantseg its tile size.
# cellsam/instantseg need their model weights + container available on the cluster (see conf/ieo.config
# instanseg_model_dir / cellsam_model_path); drop a method here if it can't run at your site.
segmentation_grid:
  stardist:
    seg_n_tiles_x:            [8, 16, 32]
    seg_n_tiles_y:            [8, 16, 32]
  instantseg:
    seg_instantseg_tile_size: [256, 512, 1024]

# REGISTRATION METHOD GRID — the head-to-head method comparison. Each registration_method is benchmarked
# with ITS OWN live knobs, exactly like segmentation_grid does per seg backend. The baseline run above is
# the VALIS anchor (registration_method=valis at defaults); this grid adds the STARE / tiled method and
# sweeps its accuracy knobs. An OFAT run of a tiled-only knob off the VALIS baseline would be a no-op, so
# per-method grids (not flat OFAT axes) are the correct structure. Like all real registration axes this
# needs a --paired matrix (a moving panel to register).
#
# reg_tiled_tile is THE fairness / granularity knob: it sets both the tile core size AND the mesh grid
# resolution (nextflow.config), so a finer grid gives STARE more local (piecewise) deformation freedom —
# the direct analog of Ashlar's re-tile granularity. reg_tiled_gate_tre gates which tiles get non-rigid
# refinement (accuracy vs cost). The remaining STARE knobs are held at their pipeline defaults:
# reg_tiled_halo / reg_tiled_upsample (secondary accuracy) and reg_tiled_fanout / reg_tiled_out_tile
# (resource + I/O, not accuracy) — add them here later if a resource/accuracy curve for them is needed.
registration_method_grid:
  tiled:
    reg_tiled_tile:     [1024, 2048, 4096]   # grid granularity / mesh resolution (px) — the fairness knob
    reg_tiled_gate_tre: [0.5, 1.0, 2.0]      # per-tile non-rigid refine gate (rigid-stage TRE, px)

# ASHLAR (third baseline) — OUT OF BAND, NOT a sweep axis. Ashlar is not a pipeline registration_method:
# it needs raw unstitched tiles with stage-position metadata, whereas Mirage inputs are pre-stitched WSIs.
# Its knobs are therefore NOT pipeline params and cannot live here (a --<name> override would fail). Ashlar
# is benchmarked by the standalone benchmarks/ashlar_eval/ harness (retile -> ashlar runner -> un-mosaic ->
# ORB scorer), scored head-to-head against VALIS + STARE via bin/registration_benchmark.py. Its tuning
# knobs, for reference, are:
#   tile_size, overlap_fraction, grid_granularity (fairness analog of reg_tiled_tile),
#   maximum_shift (µm; must exceed real cross-cycle drift), align_channel (DAPI index).
# See docs/ashlar_registration_benchmark_design.md and the implementation plan under docs/superpowers/specs/.
